<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TTDT THÀNH ĐÔ - THANH HÓA</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#102a43
}
@media(prefers-color-scheme:dark){
  body{
    background:#121824;
    color:#f4f7fb
  }
}
header{
  height:68px;
  background:#fff;
  border-bottom:1px solid #e6edf4;
  position:sticky;
  top:0;
  z-index:10
}
@media(prefers-color-scheme:dark){
  header{
    background:#1a2333;
    border-bottom-color:#2a374a
  }
}
.nav{
  max-width:1250px;
  margin:auto;
  height:100%;
  display:flex;
  align-items:center;
  padding:0 18px
}
.logo{
  font-weight:800;
  color:#1769d1;
  font-size:18px
}
nav{
  margin-left:auto;
  display:flex;
  gap:4px
}
nav button{
  border:0;
  background:transparent;
  padding:11px 13px;
  border-radius:99px;
  color:#334e68;
  cursor:pointer;
  font-weight:600
}
@media(prefers-color-scheme:dark){
  nav button{
    color:#9fb3c8
  }
}
nav button.active,
nav button:hover{
  background:#edf4ff;
  color:#1769d1
}
@media(prefers-color-scheme:dark){
  nav button.active,
  nav button:hover{
    background:#222f47;
    color:#38a169
  }
}
.hero{
  max-width:1250px;
  margin:18px auto 0;
  min-height:150px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
  background:linear-gradient(110deg,#143f72,#1769d1)
}
main{
  max-width:1250px;
  margin:auto;
  padding:18px
}
.page{
  display:none
}
.page.active{
  display:block
}
.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px
}
.card,
.panel{
  background:#fff;
  border:1px solid #e3ebf3;
  border-radius:12px;
  padding:18px;
  box-shadow:0 3px 14px #16324b0c
}
@media(prefers-color-scheme:dark){
  .card,
  .panel{
    background:#1a2333;
    border-color:#2a374a
  }
}
.card .num{
  font-size:30px;
  font-weight:800;
  color:#1769d1
}
@media(prefers-color-scheme:dark){
  .card .num{
    color:#38a169
  }
}
.actions{
  display:flex;
  gap:9px;
  margin-top:10px
}
.btn{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  background:#1769d1;
  color:#fff;
  font-weight:700;
  cursor:pointer
}
.btn.light{
  background:#edf4ff;
  color:#1769d1
}
@media(prefers-color-scheme:dark){
  .btn.light{
    background:#222f47;
    color:#9fb3c8
  }
}
.toolbar{
  display:grid;
  grid-template-columns:2fr repeat(2,1fr);
  gap:10px;
  margin-bottom:14px
}
input,
select{
  width:100%;
  padding:10px;
  border:1px solid #ccd8e2;
  border-radius:8px
}
@media(prefers-color-scheme:dark){
  input,
  select{
    background:#121824;
    border-color:#2a374a;
    color:#fff
  }
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:780px
}
th,
td{
  padding:10px;
  border-bottom:1px solid #e8eef3;
  text-align:left
}
th{
  background:#f7fafc;
  color:#486581
}
@media(prefers-color-scheme:dark){
  th{
    background:#121824;
    color:#9fb3c8
  }
  td{
    border-bottom-color:#2a374a
  }
}
.badge{
  padding:4px 8px;
  border-radius:999px;
  background:#edf4ff;
  color:#1769d1;
  font-weight:700;
  font-size:12px
}
.loading{
  text-align:center;
  padding:20px;
  color:#627d98
}
.error{
  text-align:center;
  padding:20px;
  color:#c53030
}
@media(max-width:850px){
  .nav{
    flex-direction:column;
    height:auto;
    padding:10px
  }
  .cards,
  .toolbar{
    grid-template-columns:1fr
  }
}
/* =========================================================
   THẺ THÔNG TIN CHI TIẾT HỌC VIÊN
   ========================================================= */
.student-cards{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}
.student-card{
  background:#fff;
  border:1px solid #dfe8f1;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 4px 16px rgba(22,50,75,.08);
}
.student-card-head{
  padding:18px 20px;
  background:linear-gradient(110deg,#143f72,#1769d1);
  color:#fff;
}
.student-details{
  display:none;
}
.student-card.expanded .student-details{
  display:block;
}
.student-name{
  cursor:pointer;
  user-select:none;
}
.student-name::after{
  content:'  ▾';
  font-size:12px;
  opacity:.75;
}
.student-card.expanded .student-name::after{
  content:'  ▴';
}
.student-summary{
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  margin-top:9px;
  font-size:13px;
  color:rgba(255,255,255,.9);
  cursor:pointer;
  user-select:none;
}
.student-summary b{
  color:#fff;
}
.student-card-head-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
}
.student-code{
  font-size:22px;
  font-weight:800;
  letter-spacing:.2px;
}
.student-name{
  margin-top:5px;
  font-size:18px;
  font-weight:700;
}
.student-katakana{
  margin-top:5px;
  font-size:14px;
  opacity:.9;
}
.student-status{
  padding:7px 11px;
  border-radius:999px;
  background:#fff;
  color:#1769d1;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}
.student-section-title{
  padding:11px 18px;
  background:#f7fafc;
  color:#486581;
  font-size:12px;
  font-weight:800;
  border-bottom:1px solid #e5edf4;
}
.student-info{
  display:grid;
  grid-template-columns:repeat(3,1fr);
}
.student-info-item{
  padding:13px 18px;
  border-bottom:1px solid #e8eef3;
  border-right:1px solid #e8eef3;
}
.student-info-item:nth-child(3n){
  border-right:0;
}
.student-info-label{
  font-size:11px;
  color:#627d98;
  margin-bottom:5px;
  font-weight:600;
}
.student-info-value{
  font-size:14px;
  line-height:1.4;
  font-weight:700;
  color:#102a43;
  min-height:19px;
  word-break:break-word;
}
.student-empty{
  text-align:center;
  padding:28px 18px;
  color:#627d98;
}
.student-result-count{
  margin:-2px 0 12px;
  font-size:12px;
  color:#627d98;
}
@media(prefers-color-scheme:dark){
  .student-card{
    background:#1a2333;
    border-color:#2a374a;
    box-shadow:0 4px 16px rgba(0,0,0,.18);
  }
  .student-section-title{
    background:#121824;
    color:#9fb3c8;
    border-bottom-color:#2a374a;
  }
  .student-info-item{
    border-bottom-color:#2a374a;
    border-right-color:#2a374a;
  }
  .student-info-label{
    color:#9fb3c8;
  }
  .student-info-value{
    color:#fff;
  }
  .student-result-count{
    color:#9fb3c8;
  }
  .student-empty{
    color:#9fb3c8;
  }
}
@media(max-width:850px){
  .student-info{
    grid-template-columns:repeat(2,1fr);
  }
  .student-info-item:nth-child(3n){
    border-right:1px solid #e8eef3;
  }
  .student-info-item:nth-child(2n){
    border-right:0;
  }
  @media(prefers-color-scheme:dark){
    .student-info-item:nth-child(3n){
      border-right-color:#2a374a;
    }
  }
}
@media(max-width:550px){
  .student-card-head-top{
    flex-direction:column;
    gap:10px;
  }
  .student-code{
    font-size:19px;
  }
  .student-name{
    font-size:16px;
  }
  .student-info{
    grid-template-columns:1fr;
  }
  .student-info-item,
  .student-info-item:nth-child(2n),
  .student-info-item:nth-child(3n){
    border-right:0;
  }
}
.source-detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:650px){.source-detail-grid{grid-template-columns:1fr}}
.student-details{max-height:0;overflow:hidden;transition:max-height .25s ease,padding .25s ease}
.student-card.expanded .student-details{max-height:5000px}
</style>
</head>
<body>
<header>
  <div class="nav">
    <div class="logo">✈ TTDT THÀNH ĐÔ - THANH HÓA</div>
    <nav id="nav"></nav>
  </div>
</header>
<section class="hero">
  <div>
    <h1>TTDT THÀNH ĐÔ - THANH HÓA</h1>
    <p>Hệ thống quản lý học viên tập trung</p>
  </div>
</section>
<main>
<!-- TRANG CHỦ -->
<section id="home" class="page active">
  <div class="cards">
    <div class="card">
      <div class="num" id="total">0</div>
      <h3>Tổng học viên</h3>
    </div>
    <div class="card">
      <div class="num" id="present">0</div>
      <h3>Có mặt</h3>
    </div>
    <div class="card">
      <div class="num" id="absent">0</div>
      <h3>Vắng</h3>
    </div>
    <div class="card">
      <div class="num" id="away">0</div>
      <h3>Đang về quê</h3>
    </div>
  </div>
  <div class="panel">
    <h2>Thao tác nhanh</h2>
    <div class="actions">
      <button
        class="btn light"
        onclick="show('attendance')">
        Điểm danh
      </button>
      <button
        class="btn light"
        onclick="show('students')">
        Danh sách học viên
      </button>
    </div>
  </div>
</section>
<!-- DANH SÁCH HỌC VIÊN -->
<section id="students" class="page">
  <div class="panel">
    <h2>Danh sách học viên</h2>
    <div class="toolbar">
      <input
        id="q"
        placeholder="Tìm tên hoặc mã..."
        oninput="renderStudents()">
      <select
        id="classFilter"
        onchange="renderStudents()">
        <option value="">
          Tất cả lớp
        </option>
      </select>
      <select
        id="statusFilter"
        onchange="renderStudents()">
        <option value="">
          Tất cả trạng thái
        </option>
      </select>
    </div>
    <div id="studentResultCount" class="student-result-count"></div>
    <div id="studentBody" class="student-cards">
      <div class="student-empty">
        Đang tải dữ liệu...
      </div>
    </div>
  </div>
</section>
<!-- ĐIỂM DANH -->
<section id="attendance" class="page">
  <div class="panel">
    <h2>Điểm danh</h2>
    <div
      class="toolbar"
      style="grid-template-columns:1fr 1fr">
      <input
        id="attDate"
        type="date">
      <select
        id="attClass"
        onchange="renderAttendanceList()">
        <option value="">
          Chọn lớp
        </option>
      </select>
    </div>
    <div style="overflow:auto">
      <table>
        <thead>
          <tr>
            <th>Mã HV</th>
            <th>Họ tên</th>
            <th>Trạng thái</th>
          </tr>
        </thead>
        <tbody id="attBody">
          <tr>
            <td
              colspan="3"
              style="text-align:center;padding:20px">
              Chọn lớp để điểm danh
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="actions">
      <button
        class="btn"
        onclick="saveAttendance()">
        Lưu điểm danh
      </button>
    </div>
  </div>
</section>
</main>
<script>
/* =========================================================
   API GOOGLE APPS SCRIPT
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbwoN5iK1oyxj9NNCpihSEpKFr4l1KJTbk4VBQMuGmze3twKG7lC9G4ZynW2Hps242tFLg/exec';
/* =========================================================
   BIẾN CHUNG
   ========================================================= */
let students = [];
const pages = [
  ['home','Trang chủ'],
  ['students','Học viên'],
  ['attendance','Điểm danh']
];
/* =========================================================
   KHỞI ĐỘNG
   ========================================================= */
document.addEventListener('DOMContentLoaded', () => {
  initMenu();
  document.getElementById('attDate').valueAsDate =
    new Date();
  loadData();
});
/* =========================================================
   MENU
   ========================================================= */
function initMenu(){
  const nav =
    document.getElementById('nav');
  nav.innerHTML =
    pages.map(p => `
      <button
        id="btn-${p[0]}"
        onclick="show('${p[0]}')">
        ${p[1]}
      </button>
    `).join('');
  document
    .getElementById('btn-home')
    .classList
    .add('active');
}
/* =========================================================
   CHUYỂN TRANG
   ========================================================= */
function show(id){
  document
    .querySelectorAll('.page')
    .forEach(p =>
      p.classList.remove('active')
    );
  document
    .querySelectorAll('nav button')
    .forEach(b =>
      b.classList.remove('active')
    );
  const page =
    document.getElementById(id);
  if(page){
    page.classList.add('active');
  }
  const button =
    document.getElementById(`btn-${id}`);
  if(button){
    button.classList.add('active');
  }
  if(id === 'students'){
    renderStudents();
  }
  if(id === 'attendance'){
    renderAttendanceList();
  }
}
/* =========================================================
   TẢI DỮ LIỆU TỪ GOOGLE SHEETS
   ========================================================= */
async function loadData(){
  const body =
    document.getElementById('studentBody');
  if(body){
    body.innerHTML = `
      <div class="student-empty">
        Đang tải dữ liệu...
      </div>
    `;
  }
  try{
    const response =
      await fetch(
        `${API_URL}?action=getAll`,
        {
          method:'GET',
          cache:'no-store'
        }
      );
    if(!response.ok){
      throw new Error(
        'HTTP ' + response.status
      );
    }
    const data =
      await response.json();
    console.log(
      'Dữ liệu API:',
      data
    );
    if(data.error){
      throw new Error(
        data.error
      );
    }
    students =
      Array.isArray(data.students)
        ? data.students
        : [];
    console.log(
      'Số học viên:',
      students.length
    );
    updateDashboard();
    initFilters();
    renderStudents();
  }catch(error){
    console.error(
      'Lỗi tải dữ liệu:',
      error
    );
    students = [];
    updateDashboard();
    initFilters();
    if(body){
      body.innerHTML = `
        <div class="student-empty error">
          Không tải được dữ liệu.
          <br>
          Vui lòng kiểm tra Google Apps Script / API.
          <br>
          <small>${escapeHtml(error.message || error)}</small>
        </div>
      `;
    }
  }
}
/* =========================================================
   THỐNG KÊ
   ========================================================= */
function updateDashboard(){
  document.getElementById('total')
    .innerText =
      students.length;
  document.getElementById('present')
    .innerText =
      students.filter(
        s => s.trangThai === 'Có mặt'
      ).length;
  document.getElementById('absent')
    .innerText =
      students.filter(
        s => s.trangThai === 'Vắng'
      ).length;
  document.getElementById('away')
    .innerText =
      students.filter(
        s => s.trangThai === 'Về quê'
      ).length;
}
/* =========================================================
   BỘ LỌC
   ========================================================= */
function initFilters(){
  const classes = [
    ...new Set(
      students
        .map(
          s => String(s.lop || '').trim()
        )
        .filter(Boolean)
    )
  ];
  const statuses = [
    ...new Set(
      students
        .map(
          s =>
            String(
              s.trangThai || ''
            ).trim()
        )
        .filter(Boolean)
    )
  ];
  document.getElementById(
    'classFilter'
  ).innerHTML =
    '<option value="">Tất cả lớp</option>' +
    classes
      .map(x => `
        <option value="${escapeHtml(x)}">
          ${escapeHtml(x)}
        </option>
      `)
      .join('');
  document.getElementById(
    'attClass'
  ).innerHTML =
    '<option value="">Chọn lớp</option>' +
    classes
      .map(x => `
        <option value="${escapeHtml(x)}">
          ${escapeHtml(x)}
        </option>
      `)
      .join('');
  document.getElementById(
    'statusFilter'
  ).innerHTML =
    '<option value="">Tất cả trạng thái</option>' +
    statuses
      .map(x => `
        <option value="${escapeHtml(x)}">
          ${escapeHtml(x)}
        </option>
      `)
      .join('');
}
/* =========================================================
   HIỂN THỊ DANH SÁCH HỌC VIÊN
   ========================================================= */
const studentSourceCache = {};
function renderStudents(){
  const searchInput = document.getElementById('q');
  const classInput = document.getElementById('classFilter');
  const statusInput = document.getElementById('statusFilter');
  const body = document.getElementById('studentBody');
  const countBox = document.getElementById('studentResultCount');
  if(!searchInput || !classInput || !statusInput || !body) return;
  const q = String(searchInput.value || '').toLowerCase().trim();
  const classFilter = classInput.value;
  const statusFilter = statusInput.value;
  const filtered = students.filter(student => {
    const maHV = String(student.maHV || student.code || '').toLowerCase();
    const hoTen = String(student.hoTen || student.name || '').toLowerCase();
    const katakana = String(student.katakana || '').toLowerCase();
    return (!q || maHV.includes(q) || hoTen.includes(q) || katakana.includes(q))
      && (!classFilter || student.lop === classFilter)
      && (!statusFilter || student.trangThai === statusFilter);
  });
  if(countBox){
    countBox.textContent = filtered.length === students.length
      ? `Tổng ${students.length} học viên`
      : `Hiển thị ${filtered.length} / ${students.length} học viên`;
  }
  if(filtered.length === 0){
    body.innerHTML = `<div class="student-empty">Không tìm thấy học viên phù hợp.</div>`;
    return;
  }
  body.innerHTML = filtered.map(student => {
    const maHV = student.maHV || student.code || '';
    studentSourceCache[String(maHV)] = student;
    const hoTen = student.hoTen || student.name || '';
    const katakana = student.katakana || '';
    const trangThai = student.trangThai || student.status || '';
    const detailHtml = renderAllSourceDetail(student.detail || student);
    return `
      <div class="student-card" data-mshv="${escapeHtml(maHV)}">
        <div class="student-card-head">
          <div class="student-card-head-top">
            <div>
              <div class="student-code">${escapeHtml(maHV)}</div>
              <div class="student-name"
                   onclick="toggleStudent(this)"
                   title="Bấm vào tên để xem toàn bộ thông tin từ Google Sheet">
                ${escapeHtml(hoTen)}
              </div>
              <div class="student-summary" onclick="toggleStudent(this)">
                <span><b>Lớp:</b> ${escapeHtml(student.lop || '—')}</span>
                <span><b>GVCN:</b> ${escapeHtml(student.gvcn || '—')}</span>
              </div>
              ${katakana ? `<div class="student-katakana">${escapeHtml(katakana)}</div>` : ''}
            </div>
            <div class="student-status">${escapeHtml(trangThai || '—')}</div>
          </div>
        </div>
        <div class="student-details">
          <div class="student-section-title">TOÀN BỘ THÔNG TIN TỪ GOOGLE SHEET</div>
          <div class="student-info source-detail-grid">
            ${detailHtml}
          </div>
        </div>
      </div>
    `;
  }).join('');
}
async function toggleStudent(element){
  const card = element.closest('.student-card');
  if(!card) return;
  const alreadyOpen = card.classList.contains('expanded');
  if(alreadyOpen){
    card.classList.remove('expanded');
    return;
  }
  card.classList.add('expanded');
  const details = card.querySelector('.student-info');
  const mshv = card.getAttribute('data-mshv') || '';
  // Ưu tiên dữ liệu gốc đã được getAll() trả về.
  // Như vậy không phụ thuộc vào action getStudentDetail của bản Web App cũ.
  const cached = studentSourceCache[String(mshv)];
  const cachedDetail = cached && cached.detail ? cached.detail : null;
  if(cachedDetail && Object.keys(cachedDetail).length){
    if(details) details.innerHTML = renderAllSourceDetail(cachedDetail);
    return;
  }
  if(details){
    details.innerHTML = `<div class="student-info-item"><div class="student-info-label">DỮ LIỆU GỐC</div><div class="student-info-value">Đang lấy toàn bộ thông tin từ Google Sheet...</div></div>`;
  }
  try{
    const response = await fetch(`${API_URL}?action=getStudentDetail&mshv=${encodeURIComponent(mshv)}`, {
      method:'GET',
      cache:'no-store'
    });
    if(!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    if(!data.ok || !data.student) throw new Error(data.error || 'Không tìm thấy học viên');
    const student = data.student;
    const fresh = student.detail || student;
    studentSourceCache[String(mshv)] = student;
    if(details) details.innerHTML = renderAllSourceDetail(fresh);
  }catch(error){
    console.error('Lỗi lấy chi tiết học viên:', error);
    if(details){
      details.innerHTML = `<div class="student-info-item"><div class="student-info-label">LỖI</div><div class="student-info-value">Không lấy được dữ liệu gốc: ${escapeHtml(error.message || error)}. Hãy cập nhật lại Web App bằng file Code.gs mới rồi Deploy lại.</div></div>`;
    }
  }
}
function renderAllSourceDetail(detail){
  // Giữ nguyên bố cục thẻ học viên, chỉ hiển thị các thông tin
  // CÒN LẠI từ Google Sheet, không lặp lại MSHV / Họ tên / Lớp / GVCN / Trạng thái
  // đã có sẵn ở phần đầu thẻ.
  const hiddenKeys = new Set([
    // Các thông tin đã hiển thị sẵn ở phần đầu thẻ
    'Mã học viên', 'Mã Số HV', 'MÃ SỐ HV', 'MSHV', 'Mã HV', 'Mã học viên',
    'studentCode', '実習生番号', '実習生番号（MSHV）',
    'Họ tên', 'Họ và tên', 'Tên học viên', 'Tên Romaji',
    'fullName', 'name', '指名・ローマ字', '氏名・ローマ字',
    'Lớp', 'class', 'classCode', 'クラス',
    'GVCN', 'Giáo viên chủ nhiệm', 'Giáo viên CN', 'homeroomTeacher', 'teacher',
    '担当先生', '担任先生', '担任',
    'Trạng thái', 'Status', 'status', 'ステータス'
  ].map(normalizeDetailKey));
  const entries = Object.entries(detail || {}).filter(([label]) => {
    const key = String(label || '').trim();
    return key && !hiddenKeys.has(normalizeDetailKey(key));
  });
  if(!entries.length){
    return studentInfoItem('Thông tin còn lại', 'Không có dữ liệu');
  }
  return entries.map(([label, value]) => {
    const key = String(label || '').trim();
    const text = String(value == null ? '' : value).trim();
    if(!key) return '';
    return studentInfoItem(key, text);
  }).join('');
}
function normalizeDetailKey(value){
  return String(value || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd')
    .replace(/[^a-z0-9]+/g, '');
}
function studentInfoItem(label, value){
  const text =
    String(value || '').trim();
  return `
    <div class="student-info-item">
      <div class="student-info-label">
        ${escapeHtml(label)}
      </div>
      <div class="student-info-value">
        ${
          text
            ? escapeHtml(text)
            : '—'
        }
      </div>
    </div>
  `;
}
/* =========================================================
   DANH SÁCH ĐIỂM DANH
   ========================================================= */
function renderAttendanceList(){
  const classValue =
    document.getElementById(
      'attClass'
    ).value;
  const body =
    document.getElementById(
      'attBody'
    );
  if(!body){
    return;
  }
  if(!classValue){
    body.innerHTML = `
      <tr>
        <td
          colspan="3"
          style="
            text-align:center;
            padding:20px
          ">
          Chọn lớp để điểm danh
        </td>
      </tr>
    `;
    return;
  }
  const list =
    students.filter(
      student =>
        student.lop === classValue
    );
  if(list.length === 0){
    body.innerHTML = `
      <tr>
        <td
          colspan="3"
          style="
            text-align:center;
            padding:20px
          ">
          Không có học viên
          trong lớp này
        </td>
      </tr>
    `;
    return;
  }
  body.innerHTML =
    list.map(student => `
      <tr>
        <td>
          ${escapeHtml(
            student.maHV
          )}
        </td>
        <td>
          ${escapeHtml(
            student.hoTen
          )}
        </td>
        <td>
          <select
            data-id="${escapeHtml(
              student.maHV
            )}"
            class="att-status">
            <option value="Có mặt">
              Có mặt
            </option>
            <option value="Vắng">
              Vắng
            </option>
          </select>
        </td>
      </tr>
    `)
    .join('');
}
/* =========================================================
   LƯU ĐIỂM DANH
   ========================================================= */
async function saveAttendance(){
  const date =
    document.getElementById(
      'attDate'
    ).value;
  const classValue =
    document.getElementById(
      'attClass'
    ).value;
  if(!date){
    alert(
      'Vui lòng chọn ngày'
    );
    return;
  }
  if(!classValue){
    alert(
      'Vui lòng chọn lớp'
    );
    return;
  }
  const records = [];
  document
    .querySelectorAll(
      '.att-status'
    )
    .forEach(select => {
      records.push({
        id:
          select.dataset.id,
        status:
          select.value
      });
    });
  try{
    const response =
      await fetch(
        API_URL,
        {
          method:'POST',
          headers:{
            'Content-Type':
              'text/plain;charset=utf-8'
          },
          body:
            JSON.stringify({
              action:
                'attendance',
              date:
                date,
              class:
                classValue,
              records:
                records
            })
        }
      );
    const result =
      await response.json();
    if(result.ok === false){
      throw new Error(
        result.message ||
        'Lỗi lưu điểm danh'
      );
    }
    alert(
      'Lưu thành công!'
    );
    await loadData();
    show('home');
  }catch(error){
    console.error(
      'Lỗi lưu điểm danh:',
      error
    );
    alert(
      'Lỗi lưu điểm danh: ' +
      error.message
    );
  }
}
/* =========================================================
   BẢO VỆ HTML
   ========================================================= */
function escapeHtml(value){
  return String(
    value ?? ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );
}
