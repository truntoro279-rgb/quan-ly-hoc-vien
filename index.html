<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý học viên - TDTT Thành Đô</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, Helvetica, sans-serif;
      background: #121426;
      color: #ffffff;
    }

    .header {
      background: #2463ed;
      text-align: center;
      padding: 20px;
      border-radius: 7px;
      margin-bottom: 18px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .header p {
      margin: 0;
      font-size: 15px;
    }

    .menu {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .menu button {
      border: none;
      background: #2463ed;
      color: white;
      padding: 10px 16px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .menu button:hover {
      background: #3974f5;
    }

    .menu button.active {
      border-bottom: 3px solid #ffd900;
    }

    .container {
      background: #1b2b4b;
      border-radius: 7px;
      padding: 12px;
      min-height: 300px;
    }

    .container h2 {
      margin: 0 0 15px;
      font-size: 21px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .toolbar input,
    .toolbar select {
      background: #0e172b;
      color: white;
      border: 1px solid #536482;
      border-radius: 4px;
      padding: 9px;
      outline: none;
    }

    .toolbar input {
      flex: 1;
      min-width: 150px;
    }

    .toolbar select {
      width: 160px;
    }

    .toolbar button {
      background: #2463ed;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 9px 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .toolbar button:hover {
      background: #3974f5;
    }

    .student-count {
      margin: 10px 0;
      font-size: 14px;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }

    th {
      background: #2463ed;
      padding: 8px;
      text-align: center;
      font-size: 14px;
    }

    td {
      padding: 8px;
      text-align: center;
      border: 1px solid #304566;
      background: #1c2d4d;
      font-size: 14px;
    }

    tr:nth-child(even) td {
      background: #243858;
    }

    .student-name {
      color: #ffe000;
      font-weight: bold;
      text-decoration: underline;
      cursor: pointer;
    }

    .student-name:hover {
      color: #ffffff;
    }

    .loading {
      padding: 25px;
      text-align: center;
      color: #ffe000;
    }

    .error {
      background: #7c2935;
      border: 1px solid #e45c6d;
      color: white;
      padding: 14px;
      border-radius: 4px;
      line-height: 1.7;
      margin-bottom: 10px;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #ddd;
    }

    /* Modal */
    .modal-background {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal {
      width: 100%;
      max-width: 900px;
      max-height: 92vh;
      overflow-y: auto;
      background: #203f7e;
      border: 2px solid #4b8cff;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
    }

    .modal-title {
      text-align: center;
      color: #ffe000;
      font-size: 21px;
      font-weight: bold;
      padding-bottom: 15px;
      border-bottom: 1px solid #3f5b91;
      margin-bottom: 15px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 25px;
    }

    .detail-item {
      min-height: 42px;
      padding: 10px 0;
      border-bottom: 1px solid #3c5890;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .detail-label {
      color: #dce4ff;
      font-weight: bold;
      margin-right: 5px;
    }

    .detail-value {
      color: white;
    }

    .food-box {
      margin-top: 15px;
      padding: 15px;
      border: 1px solid #6395e9;
      border-radius: 5px;
      background: #294a88;
      line-height: 1.6;
    }

    .food-label {
      color: #ffe000;
      font-weight: bold;
      margin-right: 8px;
    }

    .modal-close {
      width: 100%;
      margin-top: 15px;
      padding: 11px;
      border: none;
      border-radius: 4px;
      background: #2463ed;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-close:hover {
      background: #3974f5;
    }

    @media (max-width: 700px) {
      body {
        padding: 8px;
      }

      .header h1 {
        font-size: 20px;
      }

      .toolbar {
        flex-wrap: wrap;
      }

      .toolbar input,
      .toolbar select,
      .toolbar button {
        width: 100%;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }

      .modal {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>TDTT THÀNH ĐÔ - THANH HÓA</h1>
    <p>Hệ thống quản lý học viên tập trung</p>
  </div>

  <div class="menu">
    <button onclick="location.href='/'">Trang chủ</button>
    <button class="active">Học viên</button>
    <button>HV về quê</button>
    <button>Điểm danh</button>
    <button>Tài liệu</button>
  </div>

  <div class="container">
    <h2>Danh sách học viên</h2>

    <div class="toolbar">
      <input
        type="text"
        id="searchInput"
        placeholder="Tìm mã học viên hoặc tên..."
      >

      <select id="classFilter">
        <option value="">Tất cả lớp</option>
      </select>

      <select id="statusFilter">
        <option value="">Tất cả trạng thái</option>
      </select>

      <button onclick="taiDuLieu()">↻ Tải lại</button>
    </div>

    <div id="errorBox"></div>

    <div class="student-count" id="studentCount">
      Đang tải dữ liệu...
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Mã HV</th>
            <th>Họ tên</th>
            <th>Lớp</th>
            <th>GVCN</th>
            <th>Trạng thái</th>
          </tr>
        </thead>

        <tbody id="studentTableBody">
          <tr>
            <td colspan="5" class="loading">
              Đang tải danh sách học viên...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal chi tiết học viên -->
  <div class="modal-background" id="modalBackground">
    <div class="modal">
      <div class="modal-title">
        📋 THÔNG TIN CHI TIẾT HỌC VIÊN
      </div>

      <div id="detailContent">
        Đang tải thông tin học viên...
      </div>

      <button class="modal-close" onclick="dongModal()">
        Đóng
      </button>
    </div>
  </div>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbwOPlxlzXRBKkFJr06NKBxZNpGXgwTP9IJfM1WV4B97HdBhUyFWm-fIgETE8V-4BIzLRA/exec";

    const SHEET_ID =
      "1JI8U96SwwQXn5ZLqWNlLtGaxkRzArpljjdW9QdIOr7A";

    const SHEET_GID = "62168460";

    let danhSachHocVien = [];

    const searchInput = document.getElementById("searchInput");
    const classFilter = document.getElementById("classFilter");
    const statusFilter = document.getElementById("statusFilter");
    const studentTableBody = document.getElementById("studentTableBody");
    const studentCount = document.getElementById("studentCount");
    const errorBox = document.getElementById("errorBox");
    const modalBackground = document.getElementById("modalBackground");
    const detailContent = document.getElementById("detailContent");

    function hienThiLoi(message) {
      errorBox.innerHTML = `
        <div class="error">${message}</div>
      `;
    }

    function xoaLoi() {
      errorBox.innerHTML = "";
    }

    function giaTri(obj, ...keys) {
      for (const key of keys) {
        if (
          obj &&
          Object.prototype.hasOwnProperty.call(obj, key) &&
          obj[key] !== null &&
          obj[key] !== undefined &&
          String(obj[key]).trim() !== ""
        ) {
          return obj[key];
        }
      }

      return "";
    }

    function tenHocVien(hocVien) {
      return giaTri(
        hocVien,
        "hoTen",
        "HoTen",
        "họ tên",
        "Họ tên",
        "Tên Romaji",
        "tenRomaji",
        "TenRomaji",
        "ten",
        "name",
        "romaji"
      ) || "(Chưa có tên)";
    }

    function maHocVien(hocVien) {
      return String(
        giaTri(
          hocVien,
          "maHV",
          "mshv",
          "Mã số HV",
          "MSHV",
          "Mã HV",
          "maHv"
        ) || ""
      ).trim();
    }

    function lopHocVien(hocVien) {
      return giaTri(
        hocVien,
        "lop",
        "Lớp",
        "LOP",
        "lớp"
      ) || "Chưa có";
    }

    function giaoVienChuNhiem(hocVien) {
      return giaTri(
        hocVien,
        "gvcn",
        "GVCN",
        "Giáo viên chủ nhiệm",
        "giáo viên chủ nhiệm"
      ) || "";
    }

    function trangThaiHocVien(hocVien) {
      return giaTri(
        hocVien,
        "trangThai",
        "TrangThai",
        "Trạng thái",
        "trạng thái"
      ) || "Đang học";
    }

    function giaTriCotAC(detail) {
      /*
        Cột AC là cột thứ 29 trong Google Sheet.
        Nếu Apps Script đã trả về cotAC thì dùng cotAC.
        Nếu trả về __COT_AC__ thì dùng giá trị đó.
      */

      return giaTri(
        detail,
        "cotAC",
        "COT_AC",
        "Cột AC",
        "cột AC",
        "__COT_AC__",
        "AC",
        "Tiền ăn tháng hiện tại"
      );
    }

    function taoDanhSachBoLoc() {
      const cacLop = [
        ...new Set(
          danhSachHocVien
            .map(hv => lopHocVien(hv))
            .filter(Boolean)
        )
      ].sort();

      const cacTrangThai = [
        ...new Set(
          danhSachHocVien
            .map(hv => trangThaiHocVien(hv))
            .filter(Boolean)
        )
      ].sort();

      classFilter.innerHTML =
        `<option value="">Tất cả lớp</option>` +
        cacLop
          .map(lop => `<option value="${escapeHtml(lop)}">${escapeHtml(lop)}</option>`)
          .join("");

      statusFilter.innerHTML =
        `<option value="">Tất cả trạng thái</option>` +
        cacTrangThai
          .map(status => `<option value="${escapeHtml(status)}">${escapeHtml(status)}</option>`)
          .join("");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function hienThiDanhSach() {
      const tuKhoa = searchInput.value.trim().toLowerCase();
      const lopCanLoc = classFilter.value;
      const trangThaiCanLoc = statusFilter.value;

      const danhSachLoc = danhSachHocVien.filter(hv => {
        const ma = maHocVien(hv).toLowerCase();
        const ten = tenHocVien(hv).toLowerCase();
        const lop = String(lopHocVien(hv));
        const status = String(trangThaiHocVien(hv));

        const dungTuKhoa =
          !tuKhoa ||
          ma.includes(tuKhoa) ||
          ten.includes(tuKhoa);

        const dungLop =
          !lopCanLoc ||
          lop === lopCanLoc;

        const dungTrangThai =
          !trangThaiCanLoc ||
          status === trangThaiCanLoc;

        return dungTuKhoa && dungLop && dungTrangThai;
      });

      studentCount.textContent =
        `Tổng ${danhSachLoc.length} học viên`;

      if (danhSachLoc.length === 0) {
        studentTableBody.innerHTML = `
          <tr>
            <td colspan="5" class="empty">
              Không tìm thấy học viên
            </td>
          </tr>
        `;
        return;
      }

      studentTableBody.innerHTML = "";

      danhSachLoc.forEach(hv => {
        const ma = maHocVien(hv);
        const ten = tenHocVien(hv);
        const lop = lopHocVien(hv);
        const gvcn = giaoVienChuNhiem(hv);
        const status = trangThaiHocVien(hv);

        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${escapeHtml(ma)}</td>
          <td>
            <span class="student-name">${escapeHtml(ten)}</span>
          </td>
          <td>${escapeHtml(lop)}</td>
          <td>${escapeHtml(gvcn)}</td>
          <td>${escapeHtml(status)}</td>
        `;

        const tenElement = tr.querySelector(".student-name");

        tenElement.addEventListener("click", function() {
          xemChiTietHocVien(ma);
        });

        studentTableBody.appendChild(tr);
      });
    }

    async function taiDuLieu() {
      xoaLoi();

      studentTableBody.innerHTML = `
        <tr>
          <td colspan="5" class="loading">
            Đang tải danh sách học viên...
          </td>
        </tr>
      `;

      studentCount.textContent = "Đang tải dữ liệu...";

      try {
        const url =
          API_URL +
          "?action=getAll&time=" +
          Date.now();

        const response = await fetch(url, {
          method: "GET",
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("API trả về mã lỗi HTTP " + response.status);
        }

        const data = await response.json();

        if (!data || data.ok === false) {
          throw new Error(
            data && data.error
              ? data.error
              : "API không trả về dữ liệu hợp lệ"
          );
        }

        const students =
          data.students ||
          data.data ||
          data.danhSachHocVien ||
          [];

        if (!Array.isArray(students)) {
          throw new Error("Dữ liệu học viên không phải dạng mảng");
        }

        danhSachHocVien = students;

        taoDanhSachBoLoc();
        hienThiDanhSach();

      } catch (error) {
        console.error("Lỗi tải dữ liệu:", error);

        studentCount.textContent = "Không tải được dữ liệu";

        studentTableBody.innerHTML = `
          <tr>
            <td colspan="5" class="empty">
              Không tải được danh sách học viên
            </td>
          </tr>
        `;

        hienThiLoi(
          "Không thể tải danh sách học viên.<br>" +
          "Chi tiết lỗi: " +
          escapeHtml(error.message) +
          "<br><br>" +
          "Hãy kiểm tra lại URL Web App Apps Script và quyền triển khai."
        );
      }
    }

    async function xemChiTietHocVien(maHV) {
      modalBackground.style.display = "flex";

      detailContent.innerHTML = `
        <div class="loading">
          Đang tải thông tin học viên...
        </div>
      `;

      try {
        const url =
          API_URL +
          "?action=getStudentDetail&maHV=" +
          encodeURIComponent(maHV) +
          "&time=" +
          Date.now();

        const response = await fetch(url, {
          method: "GET",
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("API trả về mã lỗi HTTP " + response.status);
        }

        const data = await response.json();

        if (!data || data.ok === false) {
          throw new Error(
            data && data.error
              ? data.error
              : "Không tìm thấy thông tin học viên"
          );
        }

        const detail =
          data.detail ||
          data.student ||
          data.data ||
          {};

        hienThiChiTiet(detail);

      } catch (error) {
        console.error("Lỗi chi tiết học viên:", error);

        /*
          Nếu API chi tiết lỗi thì vẫn lấy dữ liệu đang có trong danh sách
          để hiển thị thông tin cơ bản.
        */
        const hocVien = danhSachHocVien.find(
          hv => maHocVien(hv) === String(maHV)
        );

        if (hocVien) {
          hienThiChiTiet(hocVien);
        } else {
          detailContent.innerHTML = `
            <div class="error">
              Không tải được thông tin học viên.<br>
              ${escapeHtml(error.message)}
            </div>
          `;
        }
      }
    }

    function hienThiChiTiet(detail) {
      const ma = maHocVien(detail);
      const ten = tenHocVien(detail);
      const lop = lopHocVien(detail);
      const gvcn = giaoVienChuNhiem(detail);
      const status = trangThaiHocVien(detail);

      const tenKatakana = giaTri(
        detail,
        "Tên Katakana",
        "tenKatakana",
        "TenKatakana",
        "katakana"
      );

      const gioiTinh = giaTri(
        detail,
        "Giới tính",
        "gioiTinh",
        "GioiTinh"
      );

      const ngaySinh = giaTri(
        detail,
        "Ngày sinh",
        "ngaySinh",
        "NgaySinh"
      );

      const nghiepDoan = giaTri(
        detail,
        "NGHIỆP ĐOÀN",
        "Nghiệp đoàn",
        "nghiepDoan"
      );

      const congTy = giaTri(
        detail,
        "CÔNG TY",
        "Công ty",
        "congTy"
      );

      const nganhNghe = giaTri(
        detail,
        "NGÀNH NGHỀ",
        "Ngành nghề",
        "nganhNghe"
      );

      const ngayNhapHoc = giaTri(
        detail,
        "Ngày nhập học thực tế",
        "ngayNhapHoc",
        "Ngày nhập học"
      );

      const ngayXuatCanh = giaTri(
        detail,
        "Ngày xuất cảnh",
        "ngayXuatCanh"
      );

      const cbtd = giaTri(
        detail,
        "CBTĐ",
        "cbtd",
        "Cán bộ"
      );

      const diaChiCongTy = giaTri(
        detail,
        "Địa chỉ công ty tiếp nhận",
        "diaChiCongTy"
      );

      const sdtHocVien = giaTri(
        detail,
        "SDT của học viên",
        "SĐT của học viên",
        "sdtHocVien"
      );

      const sdtGiaDinh = giaTri(
        detail,
        "SDT gia đình học viên",
        "SĐT gia đình học viên",
        "sdtGiaDinh"
      );

      const phongO = giaTri(
        detail,
        "Phòng ở",
        "phongO"
      );

      /*
        Lấy đúng giá trị cột AC.
        Không hiển thị tên __COT_AC__.
      */
      const tienAn = giaTriCotAC(detail);

      detailContent.innerHTML = `
        <div class="detail-grid">

          <div class="detail-item">
            <span class="detail-label">Trạng thái:</span>
            <span class="detail-value">${escapeHtml(status)}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">MÃ SỐ HV:</span>
            <span class="detail-value">${escapeHtml(ma)}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">Tên Romaji:</span>
            <span class="detail-value">${escapeHtml(ten)}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">Tên Katakana:</span>
            <span class="detail-value">${escapeHtml(tenKatakana)}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">Lớp:</span>
            <span class="detail-value">${escapeHtml(lop)}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">GVCN:</span>
            <span class="detail-value">${escapeHtml(gvcn)}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">Giới tính:</span>
            <span class="detail-value">${escapeHtml(gioiTinh)}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">Ngày sinh:</span>
            <span class="detail-value">${escapeHtml(ngaySinh)}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">NGHIỆP ĐOÀN:</span>
            <span class="detail-value">${escapeHtml(nghiepDoan)}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">CÔNG TY:</span>
            <span class="detail-value">${escapeHtml(congTy)}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">NGÀNH NGHỀ:</span>
            <span class="detail-value">${escapeHtml(nganhNghe)}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">Ngày nhập học thực tế:</span>
            <span class="detail-value">${escapeHtml(ngayNhapHoc)}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">Ngày xuất cảnh:</span>
            <span class="detail-value">${escapeHtml(ngayXuatCanh)}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">CBTĐ:</span>
            <span class="detail-value">${escapeHtml(cbtd)}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">Địa chỉ công ty tiếp nhận:</span>
            <span class="detail-value">${escapeHtml(diaChiCongTy)}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">SDT của học viên:</span>
            <span class="detail-value">${escapeHtml(sdtHocVien)}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">SDT gia đình học viên:</span>
            <span class="detail-value">${escapeHtml(sdtGiaDinh)}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">Phòng ở:</span>
            <span class="detail-value">${escapeHtml(phongO)}</span>
          </div>

        </div>

        <div class="food-box">
          <span class="food-label">Tiền ăn tháng hiện tại:</span>
          <span>${escapeHtml(tienAn || "Chưa có dữ liệu")}</span>
        </div>
      `;
    }

    function dongModal() {
      modalBackground.style.display = "none";
    }

    modalBackground.addEventListener("click", function(event) {
      if (event.target === modalBackground) {
        dongModal();
      }
    });

    searchInput.addEventListener("input", hienThiDanhSach);
    classFilter.addEventListener("change", hienThiDanhSach);
    statusFilter.addEventListener("change", hienThiDanhSach);

    taiDuLieu();
  </script>

</body>
