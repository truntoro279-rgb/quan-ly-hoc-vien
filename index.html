<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDTT THÀNH ĐÔ - THANH HÓA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #1a1a2e; color: #eee; padding: 10px; font-size: 14px; }
    .header {
      background: #165DFF; color: white; padding: 15px; text-align: center;
      border-radius: 8px; margin-bottom: 15px;
    }
    .header h1 { font-size: 22px; margin-bottom: 4px; }
    .header p { opacity: 0.9; font-size: 13px; }
    .nav { text-align: center; margin-bottom: 15px; }
    .nav button {
      background: #165DFF; color: white; border: none; padding: 8px 12px;
      border-radius: 4px; margin: 2px; cursor: pointer; font-size: 13px;
    }
    .nav button.active { background: #0e4bdd; border-bottom: 2px solid #ffd700; }
    .card { background: #16213e; padding: 15px; border-radius: 8px; }
    .card h2 { font-size: 16px; margin-bottom: 10px; }
    .stats { margin-bottom: 10px; font-weight: bold; color: #ffd700; }
    table {
      width: 100%; border-collapse: collapse;
      background: #165DFF; color: white;
    }
    th, td { padding: 8px; text-align: center; border: 1px solid #222; }
    th { background: #0e4bdd; }
    tr:nth-child(even) { background: #1f2b48; }
    .page { display: none; }
    .page.active { display: block; }
  </style>
</head>
<body>

  <div class="header">
    <h1>TDTT THÀNH ĐÔ - THANH HÓA</h1>
    <p>Hệ thống quản lý học viên tập trung</p>
  </div>

  <div class="nav">
    <button class="tab-btn" data-page="trang-chu">Trang chủ</button>
    <button class="tab-btn" data-page="hoc-vien">Học viên</button>
    <button class="tab-btn active" data-page="hv-ve-que">HV về quê</button>
    <button class="tab-btn" data-page="diem-danh">Điểm danh</button>
    <button class="tab-btn" data-page="tai-lieu">Tài liệu</button>
  </div>

  <!-- TRANG HV VỀ QUÊ — GIỮ NGUYÊN BỐ CỤC CŨ -->
  <div id="hv-ve-que" class="page active">
    <div class="card">
      <h2>Học viên về quê</h2>
      <div class="stats">Tổng số <span id="tong-veque">0</span> học viên về quê</div>
      <table id="bang-veque">
        <thead>
          <tr>
            <th>Mã HV</th>
            <th>Họ tên</th>
            <th>Lớp</th>
            <th>Trạng thái</th>
          </tr>
        </thead>
        <tbody id="dulieu-veque">
          <!-- Dữ liệu sẽ tự điền từ Google Sheet vào đây -->
          <tr><td colspan="4">Đang tải dữ liệu...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

<script>
// ===================== CẤU HÌNH =====================
// Thay bằng URL Apps Script của bạn
const API_URL = "https://script.google.com/macros/s/AKfycbwOPlxlzXRBKkFJr06NKBxZNpGXgwTP9IJfM1WV4B97HdBhUyFWm-fIgETE8V-4BIzLRA/exec";

// === LẤY DỮ LIỆU TỪ SHEET & HIỂN THỊ ===
async function taiDuLieuVeQue() {
  try {
    const res = await fetch(API_URL + "?action=getAll");
    const kq = await res.json();

    if (!kq.ok) throw new Error(kq.error || "Lỗi dữ liệu");

    const dsTatCa = kq.data || kq.students || [];

    // === LỌC HỌC VIÊN VỀ QUÊ ===
    const dsVeQue = dsTatCa.filter(hv => {
      const tt = String(hv.trangThai || hv.TrangThai || "").trim();
      return tt.includes("Về quê") || tt.includes("Nghỉ phép");
    });

    // === CẬP NHẬT SỐ LƯỢNG ===
    document.getElementById("tong-veque").textContent = dsVeQue.length;

    // === ĐIỀN DỮ LIỆU VÀO BẢNG ===
    const tbody = document.getElementById("dulieu-veque");
    if (dsVeQue.length === 0) {
      tbody.innerHTML = "<tr><td colspan='4' style='color:#aaa;'>Không có học viên về quê</td></tr>";
      return;
    }

    tbody.innerHTML = dsVeQue.map(hv => `
      <tr>
        <td>${hv.maHV || hv.MaHV || ""}</td>
        <td>${hv.hoTen || hv.HoTen || ""}</td>
        <td>${hv.lop || hv.Lop || ""}</td>
        <td>${hv.trangThai || hv.TrangThai || ""}</td>
      </tr>
    `).join("");

  } catch (e) {
    document.getElementById("dulieu-veque").innerHTML =
      `<tr><td colspan='4' style='color:red;'>Lỗi: ${e.message}</td></tr>`;
    console.error("Lỗi lấy dữ liệu:", e);
  }
}

// === CHUYỂN TRANG ===
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", function () {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    this.classList.add("active");
    document.getElementById(this.dataset.page).classList.add("active");

    // Nhấn tab HV về quê → tải dữ liệu
    if (this.dataset.page === "hv-ve-que") {
      taiDuLieuVeQue();
    }
  });
});

// === TẢI DỮ LIỆU NGAY KHI MỞ TRANG ===
window.onload = taiDuLieuVeQue;
</script>
</body>
</html>
