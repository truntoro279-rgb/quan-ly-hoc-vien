<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDTT THÀNH ĐÔ - QUẢN LÝ HỌC VIÊN</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { 
      background: #1a1a2e; color: #eee; padding: 10px; 
      font-size: 14px; line-height: 1.5;
    }
    .header { background: #165DFF; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 15px; }
    .header h1 { font-size: clamp(18px, 4vw, 24px); margin-bottom: 5px; }
    .header p { opacity: 0.9; font-size: clamp(12px, 3vw, 14px); }
    .nav { text-align: center; margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .nav button { 
      background: #165DFF; color: white; border: none; padding: 8px 10px; 
      border-radius: 4px; cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    .nav button:hover { background: #0e4bdd; }
    .nav button.active { background: #0e4bdd; border-bottom: 2px solid #ffd700; }
    .card { background: #16213e; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
    .card h2 { font-size: clamp(16px, 3.5vw, 18px); margin-bottom: 12px; }
    .toolbar { 
      margin-bottom: 12px; display: flex; gap: 8px; align-items: center; 
      flex-wrap: wrap; 
    }
    select, input[type="date"], input[type="text"] { 
      padding: 6px 8px; border-radius: 4px; border: 1px solid #444; 
      background: #0f1626; color: white; font-size: 14px; max-width: 100%;
    }
    button { 
      padding: 7px 12px; border: none; border-radius: 4px; 
      cursor: pointer; font-weight: bold; font-size: 13px;
    }
    .btn-primary { background: #165DFF; color: white; }
    .btn-primary:hover { background: #0e4bdd; }
    .btn-success { background: #00b42a; color: white; }
    .btn-success:hover { background: #009a23; }
    .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { 
      width: 100%; border-collapse: collapse; margin-top: 8px; 
      font-size: clamp(11px, 2.5vw, 13px); min-width: 600px;
    }
    th, td { border: 1px solid #333; padding: 5px 3px; text-align: center; white-space: nowrap; }
    th { background: #165DFF; }
    tr:nth-child(even) { background: #1f2b48; }
    .search-bar { margin-bottom: 12px; }
    .stats { 
      display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; 
    }
    .stat-item { 
      background: #1f2b48; padding: 8px 12px; border-radius: 6px; 
      flex: 1 1 130px; text-align: center;
    }
    .page { display: none; }
    .page.active { display: block; }
    .loading { text-align: center; padding: 20px; color: #ffd700; }
    .ten-hv { color: #ffd700; cursor: pointer; font-weight: bold; text-decoration: underline; }
    .ten-hv:hover { color: #fff; background: #165DFF; padding: 2px 4px; border-radius: 3px; }
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; 
      z-index: 999; padding: 10px;
    }
    .modal-content {
      background: #0f2862; padding: 25px; border-radius: 10px; 
      width: 100%; max-width: 850px; max-height: 90vh; overflow-y: auto;
      border: 2px solid #4a80f0; box-shadow: 0 0 30px rgba(74,128,240,0.35);
    }
    .modal-content h3 { 
      color: #ffd700; margin-bottom: 20px; text-align: center; 
      border-bottom: 1px solid #336; padding-bottom: 12px; 
      font-size: clamp(16px, 4vw, 18px);
    }
    .modal-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px 20px;
    }
    .modal-row { display: flex; margin: 4px 0; flex-wrap: wrap; }
    .modal-label { 
      width: 140px; min-width: 110px; color: #b8b8ff; font-weight: bold; 
      text-align: right; padding-right: 12px; font-size: 14px;
    }
    .modal-value { flex: 1; color: #fff; word-break: break-word; font-size: 14px; }
    .modal-close { 
      margin-top: 20px; width: 100%; padding: 12px; 
      background: #165DFF; color: white; border: none; 
      border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 15px;
    }
    .modal-close:hover { background: #0e4bdd; }
    .loading-info { text-align: center; color: #ffd700; padding: 25px; font-size: 15px; }
    @media (min-width: 768px) {
      .modal-grid { grid-template-columns: 1fr 1fr; }
      body { padding: 20px; font-size: 15px; }
      .modal-label { width: 150px; min-width: 150px; }
      .toolbar { flex-wrap: nowrap; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>TDTT THÀNH ĐÔ - THANH HÓA</h1>
    <p>Hệ thống quản lý học viên tập trung</p>
  </div>
  <div class="nav">
    <button class="tab-btn active" data-page="trang-chu">Trang chủ</button>
    <button class="tab-btn" data-page="hoc-vien">Học viên</button>
    <button class="tab-btn" data-page="hv-ve-que">HV về quê</button>
    <button class="tab-btn" data-page="diem-danh">Điểm danh</button>
    <button class="tab-btn" data-page="tai-lieu">Tài liệu</button>
  </div>
  <div id="trang-chu" class="page active">
    <div class="card">
      <h2>Thống kê tổng quan</h2>
      <div class="stats">
        <div class="stat-item">Tổng học viên: <strong id="stat-tong">0</strong></div>
        <div class="stat-item">Đang học: <strong id="stat-danghoc">0</strong></div>
        <div class="stat-item">Vắng: <strong id="stat-vang">0</strong></div>
        <div class="stat-item">Về quê: <strong id="stat-veque">0</strong></div>
      </div>
    </div>
  </div>
  <div id="hoc-vien" class="page">
    <div class="card">
      <h2>Danh sách học viên</h2>
      <div class="search-bar toolbar">
        <input type="text" id="search-ma" placeholder="Tìm mã hoặc tên..." style="flex:1; min-width:120px;">
        <select id="filter-lop"><option value="">Tất cả lớp</option></select>
        <select id="filter-trangthai"><option value="">Tất cả trạng thái</option><option>Đang học</option><option>Vắng</option><option>Về quê</option></select>
        <button class="btn-primary" id="btn-tai-lai">🔄 Tải lại</button>
      </div>
      <p id="thong-ke-danhsach">Tổng 0 học viên</p>
      <div id="danhsach-hocvien" class="table-wrapper"></div>
    </div>
  </div>
  <div id="hv-ve-que" class="page">
    <div class="card">
      <h2>Học viên về quê</h2>
      <div id="danhsach-veque" class="table-wrapper"></div>
    </div>
  </div>
  <div id="diem-danh" class="page">
    <div class="card">
      <h2>Điểm danh hàng ngày</h2>
      <div class="toolbar">
        <select id="chon-lop-diemdanh"></select>
        <label style="font-size:13px; white-space:nowrap;">Từ:</label>
        <input type="date" id="tu-ngay" style="flex:1; min-width:110px;">
        <label style="font-size:13px; white-space:nowrap;">Đến:</label>
        <input type="date" id="den-ngay" style="flex:1; min-width:110px;">
        <button class="btn-primary" id="btn-tao-bang">📋 Tạo</button>
        <button class="btn-success" id="btn-luu-bang">💾 Lưu</button>
      </div>
      <div id="bang-diemdanh" class="table-wrapper"></div>
    </div>
  </div>
  <div id="tai-lieu" class="page">
    <div class="card">
      <h2>Tài liệu</h2>
      <p>Chức năng đang cập nhật...</p>
    </div>
  </div>
  <div id="modal-chitiet" class="modal-overlay" onclick="dongModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>📋 THÔNG TIN CHI TIẾT HỌC VIÊN</h3>
      <div id="modal-body" class="loading-info">Đang tải thông tin...</div>
      <button class="modal-close" onclick="dongModalChiTiet()">Đóng</button>
    </div>
  </div>
<script>
// =====================================================
// ✅ ĐÃ NỐI SẴN SHEET CỦA BẠN — KHÔNG CẦN THAY ĐỔI!
// =====================================================
const SHEET_ID = "1JI8U96SwwQXn5ZLqWNlLtGaxkRzArpljjdW9QdIOr7A";
// Tên sheet chính (đổi nếu tên khác)
const TEN_SHEET_CHINH = "BẢNG QLTT HV 2026"; 
const TEN_SHEET_VEQUE = "VE QUE";

// Link CSV tự động tạo từ ID Sheet
const CSV_URL_CHINH = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(TEN_SHEET_CHINH)}`;
const CSV_URL_VEQUE = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(TEN_SHEET_VEQUE)}`;

let danhSachHocVien = [];
let danhSachVeQue = [];

// === XỬ LÝ NGÀY THÁNG ===
function xuLyNgayThang(giaTri, tieuDe) {
  const s = String(giaTri || "").trim();
  const ten = tieuDe.toLowerCase();
  if (ten.includes("ngày sinh") || ten.includes("ngày nhập học")) {
    if (s.indexOf("T") > 0) return s.split("T")[0];
    if (s.indexOf(" ") > 0) return s.split(" ")[0];
  }
  return s;
}

// === PHÂN TÍCH CSV → MẢNG DỮ LIỆU ===
function phanTichCSV(csvText) {
  const dong = csvText.split("\n").map(d => 
    d.replace(/\r$/, "").split(",").map(cot => cot.replace(/^"|"$/g, "").trim())
  );
  const tieuDe = dong[0];
  const duLieu = dong.slice(1).filter(hang => {
    return hang.some(c => String(c).trim() !== "");
  });
  return { tieuDe, duLieu };
}

// === LẤY VỊ TRÍ CỘT ===
function layViTriCot(tieuDe, tenCot) {
  return tieuDe.findIndex(c => 
    String(c || "").trim().toUpperCase() === String(tenCot).toUpperCase()
  );
}

// === TẢI DANH SÁCH CHÍNH TỪ SHEET ===
async function taiDuLieuTuSheetChinh() {
  try {
    console.log("🔄 Đang tải dữ liệu từ Sheet chính...");
    const res = await fetch(CSV_URL_CHINH);
    if (!res.ok) throw new Error("Không kết nối được Sheet");
    
    const csvText = await res.text();
    const { tieuDe, duLieu } = phanTichCSV(csvText);
    
    // Tìm vị trí cột
    const cotMaHV = layViTriCot(tieuDe, "Mã HV");
    const cotHoTen = layViTriCot(tieuDe, "Họ tên");
    const cotLop = layViTriCot(tieuDe, "Lớp");
    const cotGVCN = layViTriCot(tieuDe, "GVCN");
    const cotTrangThai = layViTriCot(tieuDe, "Trạng thái");

    // Chuyển thành mảng đối tượng
    danhSachHocVien = duLieu.map(hang => ({
      maHV: hang[cotMaHV] || "",
      hoTen: hang[cotHoTen] || "",
      lop: hang[cotLop] || "",
      gvcn: hang[cotGVCN] || "",
      trangThai: hang[cotTrangThai] || ""
    }));

    console.log("✅ Tải được", danhSachHocVien.length, "học viên");
    locVaDemDuLieu();
    capNhatDanhSachHocVien();
    capNhatChonLop();
    taoBangDiemDanh();

  } catch (e) {
    console.error("❌ Lỗi:", e);
    alert("❌ Không đọc được dữ liệu!\n👉 Vui lòng MỞ SHEET → Chia sẻ → Bất kỳ ai có liên kết");
  }
}

// === LỌC & ĐẾM TRẠNG THÁI ===
function locVaDemDuLieu() {
  let tong = danhSachHocVien.length;
  let dangHoc = 0, veQue = 0, vang = 0;
  
  danhSachHocVien.forEach(hv => {
    const tt = String(hv.trangThai || "").trim();
    if (tt === "Đang học" || tt === "Có mặt") dangHoc++;
    else if (tt.includes("Quê") || tt.includes("Nghỉ phép")) veQue++;
    else if (tt === "Vắng" || tt === "Vắng mặt") vang++;
    else vang++;
  });

  document.getElementById("stat-tong").textContent = tong;
  document.getElementById("stat-danghoc").textContent = dangHoc;
  document.getElementById("stat-vang").textContent = vang;
  document.getElementById("stat-veque").textContent = veQue;
}

// === TẢI HV VỀ QUÊ TỪ SHEET RIÊNG ===
async function taiDuLieuVeQue() {
  const container = document.getElementById("danhsach-veque");
  try {
    container.innerHTML = "<p style='text-align:center; color:#ffd700;'>⏳ Đang tải dữ liệu HV về quê...</p>";
    const res = await fetch(CSV_URL_VEQUE);
    if (!res.ok) throw new Error("Không kết nối được Sheet VE QUE");
    
    const csvText = await res.text();
    const { tieuDe, duLieu } = phanTichCSV(csvText);
    
    const cotMaHV = layViTriCot(tieuDe, "Mã HV");
    const cotHoTen = layViTriCot(tieuDe, "Họ tên");
    const cotLop = layViTriCot(tieuDe, "Lớp");
    const cotTrangThai = layViTriCot(tieuDe, "Trạng thái");

    danhSachVeQue = duLieu.map(hang => ({
      maHV: hang[cotMaHV] || "",
      hoTen: hang[cotHoTen] || "",
      lop: hang[cotLop] || "",
      trangThai: hang[cotTrangThai] || ""
    }));

    console.log("✅ Tải được", danhSachVeQue.length, "HV về quê");
    hienThiDanhSachVeQue();

  } catch (e) {
    console.error("❌ Lỗi Sheet VE QUE:", e);
    container.innerHTML = `
      <p style="color:#ff6b6b; text-align:center; padding:20px;">
        ⚠️ Không lấy được dữ liệu Sheet VE QUE<br>
        <strong>Vui lòng: Mở Sheet → Chia sẻ → Bất kỳ ai có liên kết</strong>
      </p>`;
  }
}

// === HIỂN THỊ DANH SÁCH VỀ QUÊ ===
function hienThiDanhSachVeQue() {
  const dsLoc = danhSachVeQue.filter(hv => {
    const tt = String(hv.trangThai || "").trim();
    return tt.includes("Quê") || tt.includes("Nghỉ phép");
  });

  document.getElementById("danhsach-veque").innerHTML = 
    `<p style="font-weight:bold; margin-bottom:10px;">Tổng ${dsLoc.length} học viên về quê</p>` +
    `<table><tr><th>Mã HV</th><th>Họ tên</th><th>Lớp</th><th>Trạng thái</th></tr>` +
    dsLoc.map(hv => `<tr>
      <td>${hv.maHV || ""}</td>
      <td class="ten-hv" onclick="xemChiTietHocVien('${hv.maHV || ""}')">${hv.hoTen || ""}</td>
      <td>${hv.lop || ""}</td>
      <td>${hv.trangThai || ""}</td>
    </tr>`).join("") + `</table>`;
  
  // Cập nhật số liệu trên trang chủ
  document.getElementById("stat-veque").textContent = dsLoc.length;
}

// === CHUYỂN TRANG ===
function ganSuKienTab() {
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", function() {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      this.classList.add("active");
      document.getElementById(this.dataset.page).classList.add("active");
      
      // Nhấn tab HV về quê → tự tải dữ liệu
      if (this.dataset.page === "hv-ve-que") {
        if (danhSachVeQue.length === 0) taiDuLieuVeQue();
        else hienThiDanhSachVeQue();
      }
    });
  });
}

// === DANH SÁCH HỌC VIÊN ===
function capNhatDanhSachHocVien() {
  const tbody = document.getElementById("danhsach-hocvien");
  const lopLoc = document.getElementById("filter-lop").value;
  const ttLoc = document.getElementById("filter-trangthai").value;
  const tuKhoa = document.getElementById("search-ma").value.toLowerCase();
  let loc = danhSachHocVien;
  if (lopLoc) loc = loc.filter(hv => (hv.lop || hv.Lop) === lopLoc);
  if (ttLoc) loc = loc.filter(hv => (hv.trangThai || hv.TrangThai) === ttLoc);
  if (tuKhoa) loc = loc.filter(hv => {
    const ma = String(hv.maHV || "").toLowerCase();
    const ten = String(hv.hoTen || "").toLowerCase();
    return ma.includes(tuKhoa) || ten.includes(tuKhoa);
  });
  document.getElementById("thong-ke-danhsach").textContent = `Tổng ${loc.length} học viên`;
  tbody.innerHTML = `<table><tr><th>Mã HV</th><th>Họ tên</th><th>Lớp</th><th>GVCN</th><th>Trạng thái</th></tr>` +
    loc.map(hv => `<tr>
      <td>${hv.maHV || ""}</td>
      <td class="ten-hv" onclick="xemChiTietHocVien('${hv.maHV || ""}')">${hv.hoTen || ""}</td>
      <td>${hv.lop || ""}</td>
      <td>${hv.gvcn || ""}</td>
      <td>${hv.trangThai || ""}</td>
    </tr>`).join("") + `</table>`;
}

// === XEM CHI TIẾT ===
async function xemChiTietHocVien(maHV) {
  const modal = document.getElementById("modal-chitiet");
  const body = document.getElementById("modal-body");
  modal.style.display = "flex";
  const hv = danhSachHocVien.find(x => x.maHV === maHV);
  if (hv) {
    body.innerHTML = `<div class="modal-grid">
      <div class="modal-row"><div class="modal-label">Mã HV:</div><div class="modal-value">${hv.maHV}</div></div>
      <div class="modal-row"><div class="modal-label">Họ tên:</div><div class="modal-value">${hv.hoTen}</div></div>
      <div class="modal-row"><div class="modal-label">Lớp:</div><div class="modal-value">${hv.lop}</div></div>
      <div class="modal-row"><div class="modal-label">GVCN:</div><div class="modal-value">${hv.gvcn}</div></div>
      <div class="modal-row"><div class="modal-label">Trạng thái:</div><div class="modal-value">${hv.trangThai}</div></div>
    </div>`;
  } else {
    body.innerHTML = `<div style="color:#ff6b6b;text-align:center;padding:20px">Không tìm thấy thông tin</div>`;
  }
}

// === ĐÓNG MODAL ===
function dongModalChiTiet() {
  document.getElementById("modal-chitiet").style.display = "none";
}
function dongModal(event) {
  if (event.target.classList.contains("modal-overlay")) dongModalChiTiet();
}

// === CẬP NHẬT LỚP ===
function capNhatChonLop() {
  const dslop = [...new Set(danhSachHocVien.map(hv => hv.lop).filter(x => x))].sort();
  const html = dslop.map(l => `<option value="${l}">${l}</option>`).join("");
  document.getElementById("filter-lop").innerHTML = `<option value="">Tất cả lớp</option>` + html;
  document.getElementById("chon-lop-diemdanh").innerHTML = html;
}

// === TẠO BẢNG ĐIỂM DANH ===
function taoBangDiemDanh() {
  const lop = document.getElementById("chon-lop-diemdanh").value;
  const tuNgay = new Date(document.getElementById("tu-ngay").value);
  const denNgay = new Date(document.getElementById("den-ngay").value);
  const dsLop = lop ? danhSachHocVien.filter(hv => hv.lop === lop) : danhSachHocVien;
  const soNgay = Math.ceil((denNgay - tuNgay) / (1000*60*60*24)) + 1;
  let ngayThu = [];
  for (let i = 0; i < soNgay; i++) {
    const d = new Date(tuNgay);
    d.setDate(d.getDate() + i);
    ngayThu.push(d.getDate() + "/" + (d.getMonth()+1));
  }
  const bang = document.getElementById("bang-diemdanh");
  bang.innerHTML = `
    <table>
      <tr><th>Mã HV</th><th>Họ tên</th>${ngayThu.map(n => `<th>${n}</th>`).join("")}</tr>
      ${dsLop.map(hv => `
        <tr>
          <td>${hv.maHV}</td>
          <td class="ten-hv">${hv.hoTen}</td>
          ${ngayThu.map(() => `<td><input type="checkbox" checked></td>`).join("")}
        </tr>`).join("")}
    </table>`;
}

// === LƯU BẢNG ĐIỂM DANH ===
async function luuBangDiemDanh() {
  alert("✅ Chức năng lưu sẽ được cập nhật sau!");
}

// === GÁN SỰ KIỆN ===
document.getElementById("search-ma").addEventListener("input", capNhatDanhSachHocVien);
document.getElementById("filter-lop").addEventListener("change", capNhatDanhSachHocVien);
document.getElementById("filter-trangthai").addEventListener("change", capNhatDanhSachHocVien);
document.getElementById("btn-tai-lai").addEventListener("click", taiDuLieuTuSheetChinh);

// === CHỌN NGÀY ===
function ganSuKienDiemDanh() {
  const hienTai = new Date();
  const dauThang = new Date(hienTai.getFullYear(), hienTai.getMonth(), 1);
  document.getElementById("tu-ngay").valueAsDate = dauThang;
  document.getElementById("den-ngay").valueAsDate = hienTai;
  document.getElementById("btn-tao-bang").onclick = taoBangDiemDanh;
  document.getElementById("btn-luu-bang").onclick = luuBangDiemDanh;
}

// === KHỞI TẠO ===
window.onload = function() {
  ganSuKienTab();
  taiDuLieuTuSheetChinh(); // Tự động tải dữ liệu từ Sheet
  ganSuKienDiemDanh();
};
</script>
</body>
</html>
