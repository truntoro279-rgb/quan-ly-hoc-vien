<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDTT THÀNH ĐÔ - QUẢN LÝ HỌC VIÊN</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { 
      background: #1a1a2e; color: #eee; padding: 10px; 
      font-size: 14px; line-height: 1.5;
    }
    .header { background: #165DFF; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 15px; }
    .header h1 { font-size: clamp(18px, 4vw, 24px); margin-bottom: 5px; }
    .header p { opacity: 0.9; font-size: clamp(12px, 3vw, 14px); }
    .nav { text-align: center; margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .nav button { 
      background: #165DFF; color: white; border: none; padding: 8px 10px; 
      border-radius: 4px; cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    .nav button:hover { background: #0e4bdd; }
    .nav button.active { background: #0e4bdd; border-bottom: 2px solid #ffd700; }
    .card { background: #16213e; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
    .card h2 { font-size: clamp(16px, 3.5vw, 18px); margin-bottom: 12px; }
    .toolbar { 
      margin-bottom: 12px; display: flex; gap: 8px; align-items: center; 
      flex-wrap: wrap; 
    }
    select, input[type="date"], input[type="text"] { 
      padding: 6px 8px; border-radius: 4px; border: 1px solid #444; 
      background: #0f1626; color: white; font-size: 14px; max-width: 100%;
    }
    button { 
      padding: 7px 12px; border: none; border-radius: 4px; 
      cursor: pointer; font-weight: bold; font-size: 13px;
    }
    .btn-primary { background: #165DFF; color: white; }
    .btn-primary:hover { background: #0e4bdd; }
    .btn-success { background: #00b42a; color: white; }
    .btn-success:hover { background: #009a23; }
    .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { 
      width: 100%; border-collapse: collapse; margin-top: 8px; 
      font-size: clamp(11px, 2.5vw, 13px); min-width: 600px;
    }
    th, td { border: 1px solid #333; padding: 5px 6px; text-align: center; white-space: nowrap; }
    th { background: #165DFF; }
    tr:nth-child(even) { background: #1f2b48; }
    .search-bar { margin-bottom: 12px; }
    .stats { 
      display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; 
    }
    .stat-item { 
      background: #1f2b48; padding: 8px 12px; border-radius: 6px; 
      flex: 1 1 130px; text-align: center;
    }
    .page { display: none; }
    .page.active { display: block; }
    .loading { text-align: center; padding: 20px; color: #ffd700; }
    .ten-hv { color: #ffd700; cursor: pointer; font-weight: bold; text-decoration: underline; }
    .ten-hv:hover { color: #fff; background: #165DFF; padding: 2px 4px; border-radius: 3px; }
    .thongbao { background: rgba(22,93,255,0.2); border: 1px solid #165DFF; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
    .loi { background: rgba(255,50,50,0.2); border: 1px solid #ff4444; color: #ff9999; }
  </style>
</head>
<body>
  <div class="header">
    <h1>TDTT THÀNH ĐÔ - THANH HÓA</h1>
    <p>Hệ thống quản lý học viên tập trung</p>
  </div>
  <div class="nav">
    <button class="tab-btn active" data-page="trang-chu">Trang chủ</button>
    <button class="tab-btn" data-page="hoc-vien">Học viên</button>
    <button class="tab-btn" data-page="hv-ve-que">HV về quê</button>
  </div>

  <!-- TRANG CHỦ -->
  <div id="trang-chu" class="page active">
    <div class="card">
      <h2>Thống kê tổng quan</h2>
      <div class="stats">
        <div class="stat-item">Tổng học viên: <strong id="stat-tong">0</strong></div>
        <div class="stat-item">Đang học: <strong id="stat-danghoc">0</strong></div>
        <div class="stat-item">Vắng: <strong id="stat-vang">0</strong></div>
        <div class="stat-item">Về quê: <strong id="stat-veque">0</strong></div>
      </div>
    </div>
  </div>

  <!-- DANH SÁCH HỌC VIÊN -->
  <div id="hoc-vien" class="page">
    <div class="card">
      <h2>Danh sách học viên</h2>
      <div class="search-bar toolbar">
        <input type="text" id="search-hv" placeholder="Tìm mã hoặc tên..." style="flex:1; min-width:150px;">
        <select id="filter-lop-hv"><option value="">Tất cả lớp</option></select>
        <select id="filter-tt-hv"><option value="">Tất cả trạng thái</option></select>
        <button class="btn-primary" id="tai-lai-hv">🔄 Tải lại</button>
      </div>
      <p id="tong-hv">Tổng 0 học viên</p>
      <div id="bang-hv"></div>
    </div>
  </div>

  <!-- HV VỀ QUÊ -->
  <div id="hv-ve-que" class="page">
    <div class="card">
      <h2>Danh sách học viên về quê</h2>
      <div class="thongbao">
        <strong>📋 Đọc từ Sheet VE QUE — Đúng cột: MSHV, Họ và tên, Lớp, Trạng thái...</strong>
      </div>
      <div class="search-bar toolbar">
        <input type="text" id="search-vq" placeholder="Tìm MSHV hoặc họ tên..." style="flex:1; min-width:150px;">
        <select id="filter-lop-vq"><option value="">Tất cả lớp</option></select>
        <button class="btn-primary" id="tai-lai-vq">🔄 Tải lại Sheet VE QUE</button>
      </div>
      <p id="tong-vq">Tổng 0 học viên</p>
      <div id="bang-vq"></div>
    </div>
  </div>

<script>
// =====================================================
// ✅ CẤU HÌNH ĐÚNG ID SHEET VÀ TÊN SHEET
// =====================================================
const SHEET_ID = "1JI8U96SwwQXn5ZLqWNlLtGaxkRzArpljjdW9QdIOr7A";
const TEN_SHEET_CHINH = "BẢNG QLTT HV 2026"; // Sheet chính
const TEN_SHEET_VEQUE = "VE QUE";              // Sheet về quê

// Link CSV tự động tạo
const URL_CHINH = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(TEN_SHEET_CHINH)}`;
const URL_VEQUE = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(TEN_SHEET_VEQUE)}`;

let dsChinh = [];  // Danh sách chính
let dsVeQue = [];  // Danh sách về quê

// === CHUYỂN CSV → MẢNG DỮ LIỆU ===
function docCSV(text) {
  const dong = text.split("\n").map(d => {
    const arr = [];
    let s = "", trong = false;
    for (let c of d) {
      if (c === '"') trong = !trong;
      else if (c === "," && !trong) { arr.push(s.trim()); s = ""; }
      else s += c;
    }
    arr.push(s.trim());
    return arr;
  });
  const tieuDe = dong[0];
  const duLieu = dong.slice(1).filter(h => h.some(c => c.trim() !== ""));
  return { tieuDe, duLieu };
}

// === TÌM VỊ TRÍ CỘT ===
function cot(tieuDe, ten) {
  return tieuDe.findIndex(c => String(c).trim().toUpperCase() === ten.toUpperCase());
}

// ========== DANH SÁCH CHÍNH ==========
async function taiChinh() {
  try {
    const res = await fetch(URL_CHINH);
    if (!res.ok) throw new Error("Không đọc được sheet chính");
    const { tieuDe, duLieu } = docCSV(await res.text());

    const cotMa = cot(tieuDe, "Mã HV");
    const cotTen = cot(tieuDe, "Họ tên");
    const cotLop = cot(tieuDe, "Lớp");
    const cotGV = cot(tieuDe, "GVCN");
    const cotTT = cot(tieuDe, "Trạng thái");

    dsChinh = duLieu.map(h => ({
      ma: h[cotMa] || "",
      ten: h[cotTen] || "",
      lop: h[cotLop] || "",
      gv: h[cotGV] || "",
      tt: h[cotTT] || ""
    }));

    capNhatBangChinh();
    capNhatThongKe();
  } catch (e) {
    alert("❌ Lỗi sheet chính: " + e.message);
  }
}

function capNhatBangChinh() {
  const lopLoc = document.getElementById("filter-lop-hv").value;
  const ttLoc = document.getElementById("filter-tt-hv").value;
  const tk = document.getElementById("search-hv").value.toLowerCase();

  let ds = dsChinh;
  if (lopLoc) ds = ds.filter(x => x.lop === lopLoc);
  if (ttLoc) ds = ds.filter(x => x.tt === ttLoc);
  if (tk) ds = ds.filter(x => x.ma.toLowerCase().includes(tk) || x.ten.toLowerCase().includes(tk));

  document.getElementById("tong-hv").textContent = `Tổng ${ds.length} học viên`;
  document.getElementById("bang-hv").innerHTML = `
    <table><tr><th>Mã HV</th><th>Họ tên</th><th>Lớp</th><th>GVCN</th><th>Trạng thái</th></tr>
    ${ds.map(x => `<tr><td>${x.ma}</td><td>${x.ten}</td><td>${x.lop}</td><td>${x.gv}</td><td>${x.tt}</td></tr>`).join("")}
    </table>`;

  // Cập nhật danh sách lớp
  const dslop = [...new Set(dsChinh.map(x => x.lop).filter(c => c))].sort();
  document.getElementById("filter-lop-hv").innerHTML = `<option value="">Tất cả lớp</option>` + 
    dslop.map(l => `<option value="${l}">${l}</option>`).join("");
}

function capNhatThongKe() {
  const tong = dsChinh.length;
  const dang = dsChinh.filter(x => x.tt.includes("Đang học") || x.tt.includes("Có mặt")).length;
  const vang = dsChinh.filter(x => x.tt.includes("Vắng") || x.tt.includes("Nghỉ phép")).length;
  const ve = dsChinh.filter(x => x.tt.includes("Quê")).length;

  document.getElementById("stat-tong").textContent = tong;
  document.getElementById("stat-danghoc").textContent = dang;
  document.getElementById("stat-vang").textContent = vang;
  document.getElementById("stat-veque").textContent = dsVeQue.length || ve;
}

// ========== SHEET VE QUE — ĐÚNG TÊN CỘT MSHV & HỌ VÀ TÊN ==========
async function taiVeQue() {
  const bang = document.getElementById("bang-vq");
  try {
    bang.innerHTML = "<p style='text-align:center; color:#ffd700; padding:20px;'>⏳ Đang đọc Sheet VE QUE...</p>";
    
    const res = await fetch(URL_VEQUE);
    if (!res.ok) throw new Error("Không kết nối được Sheet VE QUE");
    
    const text = await res.text();
    console.log("📄 Dữ liệu thô Sheet VE QUE:\n", text.substring(0, 800)); // Ghi log để kiểm tra

    const { tieuDe, duLieu } = docCSV(text);
    console.log("📋 Tiêu đề cột:", tieuDe);

    // === ĐÚNG TÊN CỘT TỪ SHEET VE QUE ===
    const cotTT = cot(tieuDe, "Trạng thái");
    const cotMSHV = cot(tieuDe, "MSHV");
    const cotHoTen = cot(tieuDe, "Họ và tên");
    const cotLop = cot(tieuDe, "Lớp");
    const cotLyDo = cot(tieuDe, "Lý do xin về");
    const cotTuNgay = cot(tieuDe, "Từngày");
    const cotDenNgay = cot(tieuDe, "Đến ngày");

    if (cotMSHV === -1 || cotHoTen === -1) {
      throw new Error("❌ Không tìm thấy cột MSHV hoặc Họ và tên trong sheet VE QUE");
    }

    dsVeQue = duLieu.map(h => ({
      tt: h[cotTT] || "",
      mshv: h[cotMSHV] || "",
      ten: h[cotHoTen] || "",
      lop: h[cotLop] || "",
      lyDo: h[cotLyDo] || "",
      tuNgay: h[cotTuNgay] || "",
      denNgay: h[cotDenNgay] || ""
    }));

    console.log("✅ Đọc được", dsVeQue.length, "dòng từ Sheet VE QUE");
    hienThiVeQue();
    capNhatThongKe();

  } catch (e) {
    console.error("❌ Lỗi VE QUE:", e);
    bang.innerHTML = `
      <div class="thongbao loi">
        <strong>Lỗi:</strong> ${e.message}<br>
        👉 Vui lòng kiểm tra:<br>
        1. Sheet VE QUE đã được <strong>Chia sẻ → Bất kỳ ai có liên kết</strong>?<br>
        2. Dòng đầu Sheet VE QUE có các cột: <strong>Trạng thái, MSHV, Họ và tên, Lớp...</strong>
      </div>`;
  }
}

function hienThiVeQue() {
  const lopLoc = document.getElementById("filter-lop-vq").value;
  const tk = document.getElementById("search-vq").value.toLowerCase();

  let ds = dsVeQue;
  if (lopLoc) ds = ds.filter(x => x.lop === lopLoc);
  if (tk) ds = ds.filter(x => x.mshv.toLowerCase().includes(tk) || x.ten.toLowerCase().includes(tk));

  document.getElementById("tong-vq").textContent = `Tổng ${ds.length} học viên về quê`;

  if (ds.length === 0) {
    document.getElementById("bang-vq").innerHTML = "<p style='text-align:center; color:#888; padding:20px;'>Không có dữ liệu hoặc đang tải...</p>";
    return;
  }

  document.getElementById("bang-vq").innerHTML = `
    <table>
      <tr><th>Trạng thái</th><th>MSHV</th><th>Họ và tên</th><th>Lớp</th><th>Lý do xin về</th><th>Từ ngày</th><th>Đến ngày</th></tr>
      ${ds.map(x => `<tr>
        <td style="color:${x.tt.includes('Đang')?'#ff6b6b':'#4ade80'}">${x.tt}</td>
        <td class="ten-hv">${x.mshv}</td>
        <td>${x.ten}</td>
        <td>${x.lop}</td>
        <td>${x.lyDo}</td>
        <td>${x.tuNgay}</td>
        <td>${x.denNgay}</td>
      </tr>`).join("")}
    </table>`;

  // Cập nhật danh sách lớp
  const dslop = [...new Set(dsVeQue.map(x => x.lop).filter(c => c))].sort();
  document.getElementById("filter-lop-vq").innerHTML = `<option value="">Tất cả lớp</option>` + 
    dslop.map(l => `<option value="${l}">${l}</option>`).join("");
}

// === CHUYỂN TAB ===
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", function() {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    this.classList.add("active");
    document.getElementById(this.dataset.page).classList.add("active");

    // Nhấn tab HV về quê → tự động tải dữ liệu
    if (this.dataset.page === "hv-ve-que" && dsVeQue.length === 0) {
      taiVeQue();
    }
  });
});

// === GÁN SỰ KIỆN ===
document.getElementById("search-hv").oninput = capNhatBangChinh;
document.getElementById("filter-lop-hv").onchange = capNhatBangChinh;
document.getElementById("filter-tt-hv").onchange = capNhatBangChinh;
document.getElementById("tai-lai-hv").onclick = taiChinh;

document.getElementById("search-vq").oninput = hienThiVeQue;
document.getElementById("filter-lop-vq").onchange = hienThiVeQue;
document.getElementById("tai-lai-vq").onclick = taiVeQue;

// === TỰ ĐỘNG TẢI KHI MỞ TRANG ===
window.onload = function() {
  taiChinh();      // Tải danh sách chính
  // Không tự tải VE QUE → chờ nhấn tab để tránh lỗi
};
</script>
</body>
</html>
