<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDTT THÀNH ĐÔ - QUẢN LÝ HỌC VIÊN</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { 
      background: #1a1a2e; color: #eee; padding: 10px; 
      font-size: 14px; line-height: 1.5;
    }
    .header { background: #165DFF; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 15px; }
    .header h1 { font-size: clamp(18px, 4vw, 24px); margin-bottom: 5px; }
    .header p { opacity: 0.9; font-size: clamp(12px, 3vw, 14px); }
    .nav { text-align: center; margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .nav button { 
      background: #165DFF; color: white; border: none; padding: 8px 10px; 
      border-radius: 4px; cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    .nav button:hover { background: #0e4bdd; }
    .nav button.active { background: #0e4bdd; border-bottom: 2px solid #ffd700; }
    .card { background: #16213e; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
    .card h2 { font-size: clamp(16px, 3.5vw, 18px); margin-bottom: 12px; }
    .toolbar { 
      margin-bottom: 12px; display: flex; gap: 8px; align-items: center; 
      flex-wrap: wrap; 
    }
    select, input[type="date"], input[type="text"] { 
      padding: 6px 8px; border-radius: 4px; border: 1px solid #444; 
      background: #0f1626; color: white; font-size: 14px; max-width: 100%;
    }
    button { 
      padding: 7px 12px; border: none; border-radius: 4px; 
      cursor: pointer; font-weight: bold; font-size: 13px;
    }
    .btn-primary { background: #165DFF; color: white; }
    .btn-primary:hover { background: #0e4bdd; }
    .btn-success { background: #00b42a; color: white; }
    .btn-success:hover { background: #009a23; }
    .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { 
      width: 100%; border-collapse: collapse; margin-top: 8px; 
      font-size: clamp(11px, 2.5vw, 13px); min-width: 600px;
    }
    th, td { border: 1px solid #333; padding: 5px 6px; text-align: center; white-space: nowrap; }
    th { background: #165DFF; }
    tr:nth-child(even) { background: #1f2b48; }
    .search-bar { margin-bottom: 12px; }
    .stats { 
      display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; 
    }
    .stat-item { 
      background: #1f2b48; padding: 8px 12px; border-radius: 6px; 
      flex: 1 1 130px; text-align: center;
    }
    .page { display: none; }
    .page.active { display: block; }
    .loading { text-align: center; padding: 20px; color: #ffd700; }
    .ten-hv { color: #ffd700; cursor: pointer; font-weight: bold; text-decoration: underline; }
    .ten-hv:hover { color: #fff; background: #165DFF; padding: 2px 4px; border-radius: 3px; }
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; 
      z-index: 999; padding: 10px;
    }
    .modal-content {
      background: #0f2862; padding: 25px; border-radius: 10px; 
      width: 100%; max-width: 850px; max-height: 90vh; overflow-y: auto;
      border: 2px solid #4a80f0; box-shadow: 0 0 30px rgba(74,128,240,0.35);
    }
    .modal-content h3 { 
      color: #ffd700; margin-bottom: 20px; text-align: center; 
      border-bottom: 1px solid #336; padding-bottom: 12px; 
      font-size: clamp(16px, 4vw, 18px);
    }
    .modal-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px 20px;
    }
    .modal-row { display: flex; margin: 4px 0; flex-wrap: wrap; }
    .modal-label { 
      width: 140px; min-width: 110px; color: #b8b8ff; font-weight: bold; 
      text-align: right; padding-right: 12px; font-size: 14px;
    }
    .modal-value { flex: 1; color: #fff; word-break: break-word; font-size: 14px; }
    .modal-close { 
      margin-top: 20px; width: 100%; padding: 12px; 
      background: #165DFF; color: white; border: none; 
      border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 15px;
    }
    .modal-close:hover { background: #0e4bdd; }
    .loading-info { text-align: center; color: #ffd700; padding: 25px; font-size: 15px; }
    @media (min-width: 768px) {
      .modal-grid { grid-template-columns: 1fr 1fr; }
      body { padding: 20px; font-size: 15px; }
      .modal-label { width: 150px; min-width: 150px; }
      .toolbar { flex-wrap: nowrap; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>TDTT THÀNH ĐÔ - THANH HÓA</h1>
    <p>Hệ thống quản lý học viên về quê</p>
  </div>
  <div class="nav">
    <button class="tab-btn active" data-page="trang-chu">Trang chủ</button>
    <button class="tab-btn" data-page="hv-ve-que">HV về quê</button>
  </div>
  <div id="trang-chu" class="page active">
    <div class="card">
      <h2>Thống kê tổng quan</h2>
      <div class="stats">
        <div class="stat-item">Tổng HV về quê: <strong id="stat-tong">0</strong></div>
        <div class="stat-item">Đang về quê: <strong id="stat-dang">0</strong></div>
        <div class="stat-item">Đã trở lại: <strong id="stat-trolai">0</strong></div>
      </div>
    </div>
  </div>
  <div id="hv-ve-que" class="page">
    <div class="card">
      <h2>Danh sách học viên về quê</h2>
      <div class="search-bar toolbar">
        <input type="text" id="search-ma" placeholder="Tìm MSHV hoặc họ tên..." style="flex:1; min-width:150px;">
        <select id="filter-lop"><option value="">Tất cả lớp</option></select>
        <button class="btn-primary" id="btn-tai-lai">🔄 Tải lại</button>
      </div>
      <p id="thong-ke-danhsach">Tổng 0 học viên</p>
      <div id="danhsach-veque" class="table-wrapper"></div>
    </div>
  </div>
  <div id="modal-chitiet" class="modal-overlay" onclick="dongModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>📋 THÔNG TIN CHI TIẾT</h3>
      <div id="modal-body" class="loading-info">Đang tải thông tin...</div>
      <button class="modal-close" onclick="dongModalChiTiet()">Đóng</button>
    </div>
  </div>
<script>
// =====================================================
// ✅ ĐÃ SỬA ĐÚNG TÊN CỘT TRONG SHEET VE QUE
// =====================================================
const SHEET_ID = "1JI8U96SwwQXn5ZLqWNlLtGaxkRzArpljjdW9QdIOr7A";
const TEN_SHEET_VEQUE = "VE QUE";

// Link CSV trực tiếp từ Sheet
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(TEN_SHEET_VEQUE)}`;

let danhSachHV = [];

// === PHÂN TÍCH CSV → MẢNG DỮ LIỆU ===
function phanTichCSV(csvText) {
  const dong = csvText.split("\n").map(d => 
    d.replace(/\r$/, "").split(",").map(cot => {
      let s = cot.trim();
      if (s.startsWith('"') && s.endsWith('"')) s = s.slice(1, -1);
      return s.trim();
    })
  );
  const tieuDe = dong[0];
  const duLieu = dong.slice(1).filter(hang => {
    return hang.some(c => String(c).trim() !== "");
  });
  return { tieuDe, duLieu };
}

// === LẤY VỊ TRÍ CỘT — ĐÚNG TÊN TỪ SHEET CỦA BẠN ===
function layCot(tieuDe, ten) {
  return tieuDe.findIndex(c => 
    String(c || "").trim().toUpperCase() === String(ten).toUpperCase()
  );
}

// === TẢI DỮ LIỆU TỪ SHEET VE QUE ===
async function taiDuLieu() {
  const container = document.getElementById("danhsach-veque");
  try {
    container.innerHTML = "<p style='text-align:center; color:#ffd700;'>⏳ Đang tải dữ liệu...</p>";
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error("Không kết nối được Sheet");
    
    const csvText = await res.text();
    console.log("📄 Nội dung CSV:", csvText.substring(0, 500)); // Ghi log để kiểm tra
    
    const { tieuDe, duLieu } = phanTichCSV(csvText);
    console.log("📋 Tiêu đề cột:", tieuDe);

    // === LẤY VỊ TRÍ CỘT ĐÚNG TÊN ===
    const cotTrangThai = layCot(tieuDe, "Trạng thái");
    const cotMSHV = layCot(tieuDe, "MSHV");
    const cotHoTen = layCot(tieuDe, "Họ và tên");
    const cotLop = layCot(tieuDe, "Lớp");
    const cotLyDo = layCot(tieuDe, "Lý do xin về");
    const cotTuGio = layCot(tieuDe, "Từ giờ");
    const cotTuNgay = layCot(tieuDe, "Từngày");
    const cotDenNgay = layCot(tieuDe, "Đến ngày");
    const cotGhiChu = layCot(tieuDe, "Ghi chú");

    if (cotMSHV === -1 || cotHoTen === -1) {
      throw new Error("Không tìm thấy cột MSHV hoặc Họ và tên");
    }

    // === CHUYỂN DỮ LIỆU ===
    danhSachHV = duLieu.map(hang => ({
      trangThai: hang[cotTrangThai] || "",
      mshv: hang[cotMSHV] || "",
      hoTen: hang[cotHoTen] || "",
      lop: hang[cotLop] || "",
      lyDo: hang[cotLyDo] || "",
      tuGio: hang[cotTuGio] || "",
      tuNgay: hang[cotTuNgay] || "",
      denNgay: hang[cotDenNgay] || "",
      ghiChu: hang[cotGhiChu] || ""
    }));

    console.log("✅ Tải được", danhSachHV.length, "học viên");
    hienThiDanhSach();

  } catch (e) {
    console.error("❌ Lỗi:", e);
    container.innerHTML = `
      <div style="color:#ff6b6b; text-align:center; padding:20px; background:rgba(255,0,0,0.1); border-radius:8px;">
        <p style="font-weight:bold; margin-bottom:10px;">❌ Lỗi: ${e.message}</p>
        <p>👉 Vui lòng kiểm tra:</p>
        <p>1. Đã <strong>Chia sẻ Sheet → Bất kỳ ai có liên kết</strong> chưa?</p>
        <p>2. Tên sheet có đúng là <strong>VE QUE</strong> không?</p>
        <p>3. Dòng đầu có các cột: <strong>Trạng thái, MSHV, Họ và tên, Lớp...</strong></p>
      </div>`;
  }
}

// === HIỂN THỊ DANH SÁCH ===
function hienThiDanhSach() {
  const lopLoc = document.getElementById("filter-lop").value;
  const tuKhoa = document.getElementById("search-ma").value.toLowerCase();
  
  let dsLoc = danhSachHV.filter(hv => {
    if (lopLoc && hv.lop !== lopLoc) return false;
    if (tuKhoa && !hv.mshv.toLowerCase().includes(tuKhoa) && !hv.hoTen.toLowerCase().includes(tuKhoa)) return false;
    return true;
  });

  // === CẬP NHẬT THỐNG KÊ ===
  const tong = danhSachHV.length;
  const dangVe = danhSachHV.filter(hv => hv.trangThai.includes("Đang")).length;
  const troLai = tong - dangVe;
  document.getElementById("stat-tong").textContent = tong;
  document.getElementById("stat-dang").textContent = dangVe;
  document.getElementById("stat-trolai").textContent = troLai;

  // === TẠO BẢNG ===
  document.getElementById("danhsach-veque").innerHTML = `
    <table>
      <tr style="background:#2a2a4a;">
        <th>STT</th>
        <th>Trạng thái</th>
        <th>MSHV</th>
        <th>Họ và tên</th>
        <th>Lớp</th>
        <th>Lý do xin về</th>
        <th>Từ ngày/giờ</th>
        <th>Đến ngày</th>
      </tr>
      ${dsLoc.map((hv, idx) => `<tr>
        <td>${idx + 1}</td>
        <td style="color:${hv.trangThai.includes('Đang')?'#ff6b6b':'#4ade80'}; font-weight:bold;">${hv.trangThai}</td>
        <td class="ten-hv" onclick="xemChiTiet('${hv.mshv}')">${hv.mshv}</td>
        <td>${hv.hoTen}</td>
        <td>${hv.lop}</td>
        <td>${hv.lyDo}</td>
        <td>${hv.tuNgay} ${hv.tuGio}</td>
        <td>${hv.denNgay}</td>
      </tr>`).join("")}
    </table>`;

  document.getElementById("thong-ke-danhsach").textContent = `Tổng ${dsLoc.length} học viên`;

  // Cập nhật danh sách lớp
  const dslop = [...new Set(danhSachHV.map(hv => hv.lop).filter(x => x))].sort();
  document.getElementById("filter-lop").innerHTML = `<option value="">Tất cả lớp</option>` + 
    dslop.map(l => `<option value="${l}">${l}</option>`).join("");
}

// === XEM CHI TIẾT ===
function xemChiTiet(mshv) {
  const hv = danhSachHV.find(x => x.mshv === mshv);
  if (!hv) return;
  const modal = document.getElementById("modal-chitiet");
  document.getElementById("modal-body").innerHTML = `
    <div class="modal-grid">
      <div class="modal-row"><div class="modal-label">Trạng thái:</div><div class="modal-value">${hv.trangThai}</div></div>
      <div class="modal-row"><div class="modal-label">MSHV:</div><div class="modal-value">${hv.mshv}</div></div>
      <div class="modal-row"><div class="modal-label">Họ và tên:</div><div class="modal-value">${hv.hoTen}</div></div>
      <div class="modal-row"><div class="modal-label">Lớp:</div><div class="modal-value">${hv.lop}</div></div>
      <div class="modal-row"><div class="modal-label">Lý do xin về:</div><div class="modal-value">${hv.lyDo}</div></div>
      <div class="modal-row"><div class="modal-label">Từ:</div><div class="modal-value">${hv.tuNgay} ${hv.tuGio}</div></div>
      <div class="modal-row"><div class="modal-label">Đến ngày:</div><div class="modal-value">${hv.denNgay}</div></div>
      <div class="modal-row"><div class="modal-label">Ghi chú:</div><div class="modal-value">${hv.ghiChu}</div></div>
    </div>`;
  modal.style.display = "flex";
}

// === ĐÓNG MODAL ===
function dongModalChiTiet() {
  document.getElementById("modal-chitiet").style.display = "none";
}
function dongModal(event) {
  if (event.target.classList.contains("modal-overlay")) dongModalChiTiet();
}

// === CHUYỂN TRANG ===
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", function() {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    this.classList.add("active");
    document.getElementById(this.dataset.page).classList.add("active");
  });
});

// === GÁN SỰ KIỆN TÌM KIẾM ===
document.getElementById("search-ma").addEventListener("input", hienThiDanhSach);
document.getElementById("filter-lop").addEventListener("change", hienThiDanhSach);
document.getElementById("btn-tai-lai").addEventListener("click", taiDuLieu);

// === TỰ ĐỘNG TẢI KHI MỞ TRANG ===
window.onload = taiDuLieu;
</script>
</body>
</html>
