<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDTT Thành Đô - Thanh Hóa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #17182b;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .header {
      background: #2161f5;
      padding: 22px 15px;
      text-align: center;
      border-radius: 7px;
      margin-bottom: 18px;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 14px;
    }

    .menu {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .menu button {
      border: none;
      background: #2161f5;
      color: white;
      padding: 10px 16px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    .menu button:hover {
      background: #3975ff;
    }

    .menu button.active {
      border-bottom: 3px solid #ffe000;
    }

    .box {
      background: #1b2a4a;
      padding: 12px;
      border-radius: 7px;
      overflow-x: auto;
    }

    .box h2 {
      margin: 0 0 15px;
      font-size: 21px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .toolbar input,
    .toolbar select {
      background: #0e1628;
      color: white;
      border: 1px solid #40506e;
      border-radius: 4px;
      padding: 10px;
      outline: none;
    }

    .toolbar input {
      flex: 1;
      min-width: 250px;
    }

    .toolbar select {
      min-width: 150px;
    }

    .toolbar button {
      background: #2161f5;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .toolbar button:hover {
      background: #3975ff;
    }

    .status {
      margin: 8px 0 12px;
      color: #ddd;
      font-size: 14px;
    }

    .error {
      display: none;
      background: #762d36;
      border: 1px solid #ff7c89;
      padding: 12px;
      border-radius: 5px;
      margin-bottom: 12px;
      color: #fff;
      white-space: pre-wrap;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th {
      background: #2161f5;
      color: white;
      padding: 9px;
      border: 1px solid #34486c;
      text-align: center;
    }

    td {
      padding: 8px;
      border: 1px solid #34486c;
      text-align: center;
      background: #192845;
    }

    tr:nth-child(even) td {
      background: #223556;
    }

    .name-button {
      color: #ffe000;
      font-weight: bold;
      text-decoration: underline;
      cursor: pointer;
      border: none;
      background: transparent;
      font-size: inherit;
    }

    .name-button:hover {
      color: #fff;
    }

    .modal-background {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal {
      width: 100%;
      max-width: 900px;
      max-height: 90vh;
      overflow-y: auto;
      background: #193574;
      border: 2px solid #4b8aff;
      border-radius: 9px;
      padding: 22px;
    }

    .modal-title {
      text-align: center;
      color: #ffe000;
      font-size: 20px;
      font-weight: bold;
      padding-bottom: 14px;
      border-bottom: 1px solid #34558f;
      margin-bottom: 15px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 30px;
    }

    .detail-item {
      display: flex;
      gap: 8px;
      padding: 9px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      line-height: 1.45;
      word-break: break-word;
    }

    .detail-label {
      min-width: 150px;
      color: #c9d2f5;
      font-weight: bold;
      text-align: right;
    }

    .detail-value {
      flex: 1;
      color: white;
      text-align: left;
    }

    .detail-ac {
      grid-column: 1 / -1;
      background: #263f72;
      border: 1px solid #4d78c9;
      border-radius: 5px;
      padding: 12px;
      margin-top: 12px;
    }

    .detail-ac .detail-label {
      color: #ffe000;
      min-width: 170px;
    }

    .close-button {
      width: 100%;
      margin-top: 18px;
      border: none;
      background: #2161f5;
      color: white;
      padding: 11px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .close-button:hover {
      background: #3975ff;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #ffe000;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #ffdfdf;
    }

    @media (max-width: 700px) {
      body {
        padding: 8px;
      }

      .header h1 {
        font-size: 21px;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }

      .detail-ac {
        grid-column: auto;
      }

      .detail-item {
        display: block;
      }

      .detail-label {
        display: block;
        text-align: left;
        margin-bottom: 3px;
      }

      .detail-value {
        display: block;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>TDTT THÀNH ĐÔ - THANH HÓA</h1>
    <p>Hệ thống quản lý học viên tập trung</p>
  </div>

  <div class="menu">
    <button>Trang chủ</button>
    <button class="active">Học viên</button>
    <button>HV về quê</button>
    <button>Điểm danh</button>
    <button>Tài liệu</button>
  </div>

  <div class="box">
    <h2>Danh sách học viên</h2>

    <div class="toolbar">
      <input
        id="searchInput"
        type="text"
        placeholder="Tìm mã học viên hoặc tên..."
      >

      <select id="classFilter">
        <option value="">Tất cả lớp</option>
      </select>

      <select id="statusFilter">
        <option value="">Tất cả trạng thái</option>
      </select>

      <button id="reloadButton">🔄 Tải lại</button>
    </div>

    <div id="errorBox" class="error"></div>

    <div id="studentCount" class="status">
      Đang tải dữ liệu...
    </div>

    <div id="tableContainer">
      <div class="loading">Đang tải danh sách học viên...</div>
    </div>
  </div>

  <!-- Hộp chi tiết học viên -->
  <div id="modalBackground" class="modal-background">
    <div class="modal">
      <div class="modal-title">
        📋 THÔNG TIN CHI TIẾT HỌC VIÊN
      </div>

      <div id="detailContent">
        Đang tải...
      </div>

      <button id="closeButton" class="close-button">
        Đóng
      </button>
    </div>
  </div>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbya2O0w0pKg8hZ1T7c7dhaHKCrpNAjuej8nuHNZ5z6mlgmob6E5KOhHJcU556a8wAQ2IQ/exec";

    let danhSachHocVien = [];

    const searchInput = document.getElementById("searchInput");
    const classFilter = document.getElementById("classFilter");
    const statusFilter = document.getElementById("statusFilter");
    const reloadButton = document.getElementById("reloadButton");
    const tableContainer = document.getElementById("tableContainer");
    const studentCount = document.getElementById("studentCount");
    const errorBox = document.getElementById("errorBox");

    const modalBackground = document.getElementById("modalBackground");
    const detailContent = document.getElementById("detailContent");
    const closeButton = document.getElementById("closeButton");

    function hienThiLoi(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    function anLoi() {
      errorBox.textContent = "";
      errorBox.style.display = "none";
    }

    function giaTri(obj, ...keys) {
      if (!obj || typeof obj !== "object") {
        return "";
      }

      for (const key of keys) {
        if (
          Object.prototype.hasOwnProperty.call(obj, key) &&
          obj[key] !== null &&
          obj[key] !== undefined &&
          String(obj[key]).trim() !== ""
        ) {
          return obj[key];
        }
      }

      return "";
    }

    /*
      HÀM LẤY TÊN HỌC VIÊN

      Ưu tiên hoTen vì API Code.gs đang trả về trường này.
      Có thêm nhiều tên trường dự phòng để không bị lỗi.
    */
    function layTenHocVien(hocVien) {
      const ten = giaTri(
        hocVien,
        "hoTen",
        "HoTen",
        "ten",
        "name",
        "ho_ten",
        "Tên Romaji",
        "Tên romaji",
        "Họ tên",
        "HỌ TÊN",
        "romaji",
        "TenRomaji"
      );

      if (ten !== "") {
        return String(ten).trim();
      }

      /*
        Nếu API trả dữ liệu dạng mảng data,
        cột D thường là tên học viên, index = 3.
      */
      if (
        Array.isArray(hocVien.data) &&
        hocVien.data.length > 3 &&
        String(hocVien.data[3]).trim() !== ""
      ) {
        return String(hocVien.data[3]).trim();
      }

      return "Chưa có tên";
    }

    function layMaHV(hocVien) {
      return String(
        giaTri(
          hocVien,
          "maHV",
          "mshv",
          "Mã số HV",
          "MÃ SỐ HV",
          "ma_hv",
          "id"
        ) || ""
      ).trim();
    }

    function layLop(hocVien) {
      return String(
        giaTri(
          hocVien,
          "lop",
          "Lớp",
          "class",
          "tenLop"
        ) || "Chưa có"
      ).trim();
    }

    function layGVCN(hocVien) {
      return String(
        giaTri(
          hocVien,
          "gvcn",
          "GVCN",
          "Giáo viên chủ nhiệm",
          "giaoVienChuNhiem"
        ) || ""
      ).trim();
    }

    function layTrangThai(hocVien) {
      return String(
        giaTri(
          hocVien,
          "trangThai",
          "TrangThai",
          "Trạng thái",
          "status"
        ) || "Đang học"
      ).trim();
    }

    /*
      Lấy nội dung cột AC.

      Cột AC là cột thứ 29.
      Trong mảng JavaScript, vị trí tương ứng là data[28].
    */
    function layCotAC(hocVien) {
      let ac = giaTri(
        hocVien,
        "cotAC",
        "noiDungCotAC",
        "Nội dung cột AC",
        "Cột AC",
        "AC"
      );

      if (ac !== "") {
        return String(ac);
      }

      if (Array.isArray(hocVien.data) && hocVien.data.length > 28) {
        return String(hocVien.data[28] ?? "");
      }

      return "";
    }

    function taoDanhSachLoc() {
      const lopSet = new Set();
      const trangThaiSet = new Set();

      danhSachHocVien.forEach(hocVien => {
        const lop = layLop(hocVien);
        const trangThai = layTrangThai(hocVien);

        if (lop) lopSet.add(lop);
        if (trangThai) trangThaiSet.add(trangThai);
      });

      classFilter.innerHTML =
        '<option value="">Tất cả lớp</option>';

      [...lopSet]
        .sort()
        .forEach(lop => {
          const option = document.createElement("option");
          option.value = lop;
          option.textContent = lop;
          classFilter.appendChild(option);
        });

      statusFilter.innerHTML =
        '<option value="">Tất cả trạng thái</option>';

      [...trangThaiSet]
        .sort()
        .forEach(trangThai => {
          const option = document.createElement("option");
          option.value = trangThai;
          option.textContent = trangThai;
          statusFilter.appendChild(option);
        });
    }

    function renderDanhSach() {
      const tuKhoa = searchInput.value.trim().toLowerCase();
      const lopCanLoc = classFilter.value;
      const trangThaiCanLoc = statusFilter.value;

      const danhSachLoc = danhSachHocVien.filter(hocVien => {
        const maHV = layMaHV(hocVien).toLowerCase();
        const ten = layTenHocVien(hocVien).toLowerCase();
        const lop = layLop(hocVien);
        const trangThai = layTrangThai(hocVien);

        const dungTuKhoa =
          !tuKhoa ||
          maHV.includes(tuKhoa) ||
          ten.includes(tuKhoa);

        const dungLop =
          !lopCanLoc || lop === lopCanLoc;

        const dungTrangThai =
          !trangThaiCanLoc ||
          trangThai === trangThaiCanLoc;

        return dungTuKhoa && dungLop && dungTrangThai;
      });

      studentCount.textContent =
        "Tổng " + danhSachLoc.length + " học viên";

      if (danhSachLoc.length === 0) {
        tableContainer.innerHTML =
          '<div class="empty">Không tìm thấy học viên.</div>';
        return;
      }

      const table = document.createElement("table");

      table.innerHTML = `
        <thead>
          <tr>
            <th>Mã HV</th>
            <th>Họ tên</th>
            <th>Lớp</th>
            <th>GVCN</th>
            <th>Trạng thái</th>
          </tr>
        </thead>
        <tbody></tbody>
      `;

      const tbody = table.querySelector("tbody");

      danhSachLoc.forEach(hocVien => {
        const tr = document.createElement("tr");

        const tdMa = document.createElement("td");
        tdMa.textContent = layMaHV(hocVien);

        const tdTen = document.createElement("td");
        const buttonTen = document.createElement("button");

        buttonTen.className = "name-button";
        buttonTen.textContent = layTenHocVien(hocVien);

        buttonTen.addEventListener("click", () => {
          xemChiTietHocVien(layMaHV(hocVien));
        });

        tdTen.appendChild(buttonTen);

        const tdLop = document.createElement("td");
        tdLop.textContent = layLop(hocVien);

        const tdGVCN = document.createElement("td");
        tdGVCN.textContent = layGVCN(hocVien);

        const tdTrangThai = document.createElement("td");
        tdTrangThai.textContent = layTrangThai(hocVien);

        tr.appendChild(tdMa);
        tr.appendChild(tdTen);
        tr.appendChild(tdLop);
        tr.appendChild(tdGVCN);
        tr.appendChild(tdTrangThai);

        tbody.appendChild(tr);
      });

      tableContainer.innerHTML = "";
      tableContainer.appendChild(table);
    }

    async function taiDuLieu() {
      anLoi();

      tableContainer.innerHTML =
        '<div class="loading">Đang tải danh sách học viên...</div>';

      studentCount.textContent = "Đang tải dữ liệu...";

      try {
        const response = await fetch(
          API_URL + "?action=getAll&time=" + Date.now(),
          {
            method: "GET",
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            "API trả về mã lỗi HTTP " + response.status
          );
        }

        const data = await response.json();

        if (!data || data.ok !== true) {
          throw new Error(
            data && data.error
              ? data.error
              : "API không trả dữ liệu hợp lệ."
          );
        }

        if (!Array.isArray(data.students)) {
          throw new Error(
            "API không có mảng students."
          );
        }

        danhSachHocVien = data.students;

        taoDanhSachLoc();
        renderDanhSach();

      } catch (error) {
        console.error("Lỗi tải dữ liệu:", error);

        studentCount.textContent = "Không tải được dữ liệu";

        tableContainer.innerHTML = "";

        hienThiLoi(
          "Không thể tải danh sách học viên.\n\n" +
          "Chi tiết lỗi: " + error.message + "\n\n" +
          "Hãy kiểm tra lại URL Web App và quyền triển khai Apps Script."
        );
      }
    }

   async function xemChiTietHocVien(maHV) {

  const modal = document.getElementById("modal-chitiet");
  const body = document.getElementById("modal-body");

  modal.style.display = "flex";

  body.innerHTML =
    '<div class="loading-info">⏳ Đang tải thông tin học viên...</div>';

  try {

    const url =
      API_URL +
      "?action=getStudentDetail&maHV=" +
      encodeURIComponent(maHV) +
      "&v=" +
      Date.now();

    const response = await fetch(url, {
      method: "GET",
      cache: "no-store"
    });

    const result = await response.json();

    if (!result.ok || !result.detail) {
      throw new Error(
        result.message || "Không tìm thấy thông tin học viên"
      );
    }

    const detail = result.detail;

    let html = '<div class="modal-grid">';

    Object.entries(detail).forEach(function([key, value]) {

      const title = String(key || "").trim();
      const text = String(value ?? "").trim();

      // BỎ CÁC DÒNG KỸ THUẬT, KHÔNG HIỆN __COT_AC__
      const lowerKey = title.toLowerCase();

      if (
        lowerKey === "__cot_ac__" ||
        lowerKey === "cotac" ||
        lowerKey === "cot_ac" ||
        lowerKey === "noidungcotac" ||
        lowerKey === "nội dung cột ac"
      ) {
        return;
      }

      // Không hiển thị dòng không có tiêu đề hoặc không có dữ liệu
      if (!title || !text) {
        return;
      }

      html +=
        '<div class="modal-row">' +
          '<div class="modal-label">' +
            esc(title) +
          ':</div>' +
          '<div class="modal-value">' +
            esc(text) +
          '</div>' +
        '</div>';

    });

    html += '</div>';

    body.innerHTML = html;

  } catch (error) {

    body.innerHTML =
      '<div style="color:#ff6b6b;text-align:center;padding:20px">' +
        '❌ ' + esc(error.message) +
      '</div>';

  }
}

    function hienThiChiTiet(detail, apiData) {
      const boQua = new Set([
        "_rowNumber",
        "rowNumber",
        "data",
        "cotAC",
        "noiDungCotAC",
        "Nội dung cột AC",
        "Cột AC",
        "AC"
      ]);

      const danhSachChiTiet = [];

      Object.keys(detail).forEach(key => {
        if (boQua.has(key)) return;

        const value = detail[key];

        if (
          value === null ||
          value === undefined ||
          String(value).trim() === ""
        ) {
          return;
        }

        danhSachChiTiet.push({
          label: key,
          value: String(value)
        });
      });

      const ac = layCotAC(detail);

      let html = '<div class="detail-grid">';

      danhSachChiTiet.forEach(item => {
        html += `
          <div class="detail-item">
            <div class="detail-label">${escapeHtml(item.label)}:</div>
            <div class="detail-value">${escapeHtml(item.value)}</div>
          </div>
        `;
      });

      /*
        Luôn hiển thị khu vực CỘT AC,
        kể cả khi dữ liệu cột AC đang trống.
      */
      html += `
        <div class="detail-ac">
          <div class="detail-item" style="border-bottom:none;">
            <div class="detail-label">NỘI DUNG CỘT AC:</div>
            <div class="detail-value">
              ${
                ac.trim() !== ""
                  ? escapeHtml(ac)
                  : '<span style="color:#ffb4b4;">Cột AC hiện đang trống</span>'
              }
            </div>
          </div>
        </div>
      `;

      html += "</div>";

      html += `
        <button class="close-button" id="closeButtonInside">
          Đóng
        </button>
      `;

      detailContent.innerHTML = html;

      document
        .getElementById("closeButtonInside")
        .addEventListener("click", dongModal);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function dongModal() {
      modalBackground.style.display = "none";
    }

    searchInput.addEventListener("input", renderDanhSach);
    classFilter.addEventListener("change", renderDanhSach);
    statusFilter.addEventListener("change", renderDanhSach);
    reloadButton.addEventListener("click", taiDuLieu);
    closeButton.addEventListener("click", dongModal);

    modalBackground.addEventListener("click", event => {
      if (event.target === modalBackground) {
        dongModal();
      }
    });

    taiDuLieu();
  </script>

</body>
</html>
