<!-- =====================================================
     TRANG QUẢN LÝ HỌC VIÊN — ĐÃ THÊM SẴN SHEET VE QUE
     ===================================================== -->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDTT THÀNH ĐÔ - THANH HÓA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { 
      background: #1a1a2e; color: #eee; padding: 10px; 
      font-size: 14px; line-height: 1.5;
    }
    .header { background: #165DFF; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 15px; }
    .header h1 { font-size: clamp(18px, 4vw, 24px); margin-bottom: 5px; }
    .header p { opacity: 0.9; font-size: clamp(12px, 3vw, 14px); }
    .nav { text-align: center; margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .nav button { 
      background: #165DFF; color: white; border: none; padding: 8px 12px; 
      border-radius: 4px; cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    .nav button:hover { background: #0e4bdd; }
    .nav button.active { background: #0e4bdd; border-bottom: 2px solid #ffd700; }
    .card { background: #16213e; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
    .card h2 { font-size: clamp(16px, 3.5vw, 18px); margin-bottom: 12px; }
    .toolbar { 
      margin-bottom: 12px; display: flex; gap: 8px; align-items: center; 
      flex-wrap: wrap; 
    }
    select, input[type="text"] { 
      padding: 6px 8px; border-radius: 4px; border: 1px solid #444; 
      background: #0f1626; color: white; font-size: 14px;
    }
    button { 
      padding: 7px 12px; border: none; border-radius: 4px; 
      cursor: pointer; font-weight: bold; font-size: 13px;
    }
    .btn-primary { background: #165DFF; color: white; }
    .btn-primary:hover { background: #0e4bdd; }
    .table-wrapper { width: 100%; overflow-x: auto; }
    table { 
      width: 100%; border-collapse: collapse; margin-top: 8px; 
      font-size: clamp(11px, 2.5vw, 13px);
    }
    th, td { border: 1px solid #333; padding: 6px 5px; text-align: center; white-space: nowrap; }
    th { background: #165DFF; }
    tr:nth-child(even) { background: #1f2b48; }
    .stats { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .stat-item { 
      background: #1f2b48; padding: 8px 12px; border-radius: 6px; 
      flex: 1 1 130px; text-align: center;
    }
    .page { display: none; }
    .page.active { display: block; }
    .thongbao { background: rgba(22,93,255,0.2); border: 1px solid #165DFF; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size:13px; }
    .loi { background: rgba(255,50,50,0.2); border: 1px solid #ff4444; color: #ff9999; }
  </style>
</head>
<body>

  <div class="header">
    <h1>TDTT THÀNH ĐÔ - THANH HÓA</h1>
    <p>Hệ thống quản lý học viên tập trung</p>
  </div>

  <div class="nav">
    <button class="tab-btn active" data-page="trang-chu">Trang chủ</button>
    <button class="tab-btn" data-page="hoc-vien">Học viên</button>
    <button class="tab-btn" data-page="hv-ve-que">HV về quê</button>
  </div>

  <!-- TRANG CHỦ -->
  <div id="trang-chu" class="page active">
    <div class="card">
      <h2>Thống kê tổng quan</h2>
      <div class="stats">
        <div class="stat-item">Tổng học viên: <strong id="stat-tong">0</strong></div>
        <div class="stat-item">Đang học: <strong id="stat-danghoc">0</strong></div>
        <div class="stat-item">Vắng: <strong id="stat-vang">0</strong></div>
        <div class="stat-item">Về quê: <strong id="stat-veque">0</strong></div>
      </div>
    </div>
  </div>

  <!-- DANH SÁCH HỌC VIÊN CHÍNH -->
  <div id="hoc-vien" class="page">
    <div class="card">
      <h2>Danh sách học viên</h2>
      <div class="toolbar">
        <input type="text" id="search-hv" placeholder="Tìm mã hoặc tên...">
        <select id="filter-lop-hv"><option value="">Tất cả lớp</option></select>
        <select id="filter-tt-hv"><option value="">Tất cả trạng thái</option></select>
        <button class="btn-primary" id="tai-lai-hv">🔄 Tải lại</button>
      </div>
      <p style="margin:8px 0;">Tổng: <span id="tong-hv">0</span> học viên</p>
      <div id="bang-hv" class="table-wrapper"></div>
    </div>
  </div>

  <!-- HV VỀ QUÊ → ĐỌC TỪ SHEET VE QUE -->
  <div id="hv-ve-que" class="page">
    <div class="card">
      <h2>Danh sách học viên về quê</h2>
      <div class="thongbao">✅ Đọc từ Sheet VE QUE — Dòng 2 = tiêu đề, Dòng 3 trở đi = dữ liệu</div>
      <div class="toolbar">
        <input type="text" id="search-vq" placeholder="Tìm MSHV hoặc họ tên...">
        <select id="filter-lop-vq"><option value="">Tất cả lớp</option></select>
        <button class="btn-primary" id="tai-lai-vq">🔄 Tải lại Sheet VE QUE</button>
      </div>
      <p style="margin:8px 0;">Tổng: <span id="tong-vq">0</span> học viên</p>
      <div id="bang-vq" class="table-wrapper"></div>
    </div>
  </div>

<script>
// =====================================================
// CẤU HÌNH SHEET — ĐỪNG THAY ĐỔI
// =====================================================
const SHEET_ID = "1JI8U96SwwQXn5ZLqWNlLtGaxkRzArpljjdW9QdIOr7A";
const TEN_SHEET_CHINH = "BẢNG QLTT HV 2026";
const TEN_SHEET_VEQUE = "VE QUE";

const URL_CHINH = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(TEN_SHEET_CHINH)}`;
const URL_VEQUE = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(TEN_SHEET_VEQUE)}`;

let dsChinh = [];
let dsVeQue = [];

// === PHÂN TÍCH CSV ===
function docCSV(text) {
  const dong = text.split("\n").map(d => {
    const arr = [];
    let s = "", trong = false;
    for (let c of d) {
      if (c === '"') trong = !trong;
      else if (c === "," && !trong) { arr.push(s.trim()); s = ""; }
      else s += c;
    }
    arr.push(s.trim());
    return arr;
  });
  return dong;
}

// === TÌM VỊ TRÍ CỘT THEO TÊN ===
function timCot(arrTieuDe, ten) {
  return arrTieuDe.findIndex(c => String(c || "").trim().toUpperCase() === ten.toUpperCase());
}

// ========== 1. DANH SÁCH CHÍNH ==========
async function taiDanhSachChinh() {
  try {
    const res = await fetch(URL_CHINH);
    if (!res.ok) throw new Error("Không kết nối được Sheet");
    const tatCaDong = docCSV(await res.text());
    
    const tieuDe = tatCaDong[0];
    const duLieu = tatCaDong.slice(1).filter(h => h.some(c => String(c).trim() !== ""));

    const cotMa = timCot(tieuDe, "Mã HV");
    const cotTen = timCot(tieuDe, "Họ tên");
    const cotLop = timCot(tieuDe, "Lớp");
    const cotGV = timCot(tieuDe, "GVCN");
    const cotTT = timCot(tieuDe, "Trạng thái");

    dsChinh = duLieu.map(h => ({
      ma: h[cotMa] || "",
      ten: h[cotTen] || "",
      lop: h[cotLop] || "",
      gv: h[cotGV] || "",
      tt: h[cotTT] || ""
    }));

    capNhatBangChinh();
    capNhatThongKe();

  } catch (e) {
    alert("Lỗi danh sách chính: " + e.message);
  }
}

function capNhatBangChinh() {
  const lopLoc = document.getElementById("filter-lop-hv").value;
  const ttLoc = document.getElementById("filter-tt-hv").value;
  const tuKhoa = document.getElementById("search-hv").value.toLowerCase();

  let ds = dsChinh;
  if (lopLoc) ds = ds.filter(x => x.lop === lopLoc);
  if (ttLoc) ds = ds.filter(x => x.tt === ttLoc);
  if (tuKhoa) ds = ds.filter(x => 
    x.ma.toLowerCase().includes(tuKhoa) || x.ten.toLowerCase().includes(tuKhoa)
  );

  document.getElementById("tong-hv").textContent = ds.length;
  document.getElementById("bang-hv").innerHTML = `
    <table>
      <tr><th>Mã HV</th><th>Họ tên</th><th>Lớp</th><th>GVCN</th><th>Trạng thái</th></tr>
      ${ds.map(x => `<tr>
        <td style="font-weight:bold; color:#ffd700;">${x.ma}</td>
        <td>${x.ten}</td>
        <td>${x.lop}</td>
        <td>${x.gv}</td>
        <td>${x.tt}</td>
      </tr>`).join("")}
    </table>`;

  const dslop = [...new Set(dsChinh.map(x => x.lop).filter(c => c))].sort();
  document.getElementById("filter-lop-hv").innerHTML = `<option value="">Tất cả lớp</option>` + 
    dslop.map(l => `<option value="${l}">${l}</option>`).join("");

  const dstt = [...new Set(dsChinh.map(x => x.tt).filter(c => c))].sort();
  document.getElementById("filter-tt-hv").innerHTML = `<option value="">Tất cả trạng thái</option>` + 
    dstt.map(t => `<option value="${t}">${t}</option>`).join("");
}

function capNhatThongKe() {
  const tong = dsChinh.length;
  const dang = dsChinh.filter(x => x.tt.includes("Đang học") || x.tt.includes("Có mặt")).length;
  const vang = dsChinh.filter(x => x.tt.includes("Vắng") || x.tt.includes("Vắng mặt")).length;
  const ve = dsVeQue.length || dsChinh.filter(x => x.tt.includes("Quê") || x.tt.includes("Nghỉ phép")).length;

  document.getElementById("stat-tong").textContent = tong;
  document.getElementById("stat-danghoc").textContent = dang;
  document.getElementById("stat-vang").textContent = vang;
  document.getElementById("stat-veque").textContent = ve;
}

// ========== 2. SHEET VE QUE — ĐỌNG DÒNG 2 = TIÊU ĐỀ, DÒNG 3 = DỮ LIỆU ==========
async function taiDanhSachVeQue() {
  const bang = document.getElementById("bang-vq");
  try {
    bang.innerHTML = "<p style='text-align:center; color:#ffd700; padding:20px;'>⏳ Đang đọc Sheet VE QUE...</p>";

    const res = await fetch(URL_VEQUE);
    if (!res.ok) throw new Error("Không kết nối được Sheet VE QUE — Kiểm tra Chia sẻ → Bất kỳ ai có liên kết");

    const tatCaDong = docCSV(await res.text());
    
    // ✅ BỎ QUA DÒNG 1 → LẤY TIÊU ĐỀ Ở DÒNG 2, DỮ LIỆU TỪ DÒNG 3
    const tieuDeCot = tatCaDong[1];
    const duLieu = tatCaDong.slice(2).filter(h => h.some(c => String(c).trim() !== ""));

    // TÌM ĐÚNG TÊN CỘT TRONG SHEET VE QUE
    const cotTT = timCot(tieuDeCot, "Trạng thái");
    const cotMSHV = timCot(tieuDeCot, "MSHV");
    const cotHoTen = timCot(tieuDeCot, "Họ và tên");
    const cotLop = timCot(tieuDeCot, "Lớp");
    const cotLyDo = timCot(tieuDeCot, "Lý do xin về");
    const cotTuNgay = timCot(tieuDeCot, "Từngày");
    const cotDenNgay = timCot(tieuDeCot, "Đến ngày");

    if (cotMSHV === -1 || cotHoTen === -1) {
      throw new Error("❌ Không tìm thấy cột MSHV hoặc Họ và tên ở dòng 2 Sheet VE QUE");
    }

    dsVeQue = duLieu.map(h => ({
      tt: h[cotTT] || "",
      mshv: h[cotMSHV] || "",
      ten: h[cotHoTen] || "",
      lop: h[cotLop] || "",
      lyDo: h[cotLyDo] || "",
      tuNgay: h[cotTuNgay] || "",
      denNgay: h[cotDenNgay] || ""
    }));

    hienThiBangVeQue();
    capNhatThongKe();

  } catch (e) {
    bang.innerHTML = `
      <div class="thongbao loi">
        <strong>Lỗi:</strong> ${e.message}<br>
        👉 Kiểm tra: Sheet VE QUE → Chia sẻ → Bất kỳ ai có liên kết → Lưu
      </div>`;
  }
}

function hienThiBangVeQue() {
  const lopLoc = document.getElementById("filter-lop-vq").value;
  const tuKhoa = document.getElementById("search-vq").value.toLowerCase();

  let ds = dsVeQue;
  if (lopLoc) ds = ds.filter(x => x.lop === lopLoc);
  if (tuKhoa) ds = ds.filter(x => 
    x.mshv.toLowerCase().includes(tuKhoa) || x.ten.toLowerCase().includes(tuKhoa)
  );

  document.getElementById("tong-vq").textContent = ds.length;

  if (ds.length === 0) {
    document.getElementById("bang-vq").innerHTML = "<p style='text-align:center; color:#888; padding:20px;'>Không có dữ liệu hoặc đang tải...</p>";
    return;
  }

  document.getElementById("bang-vq").innerHTML = `
    <table>
      <tr style="background:#0e4bdd;">
        <th>Trạng thái</th>
        <th>MSHV</th>
        <th>Họ và tên</th>
        <th>Lớp</th>
        <th>Lý do xin về</th>
        <th>Từ ngày</th>
        <th>Đến ngày</th>
      </tr>
      ${ds.map(x => `<tr>
        <td style="color:${x.tt.includes('Đang')?'#ff6b6b':'#4ade80'}; font-weight:bold;">${x.tt}</td>
        <td style="font-weight:bold; color:#ffd700;">${x.mshv}</td>
        <td>${x.ten}</td>
        <td>${x.lop}</td>
        <td>${x.lyDo}</td>
        <td>${x.tuNgay}</td>
        <td>${x.denNgay}</td>
      </tr>`).join("")}
    </table>`;

  const dslop = [...new Set(dsVeQue.map(x => x.lop).filter(c => c))].sort();
  document.getElementById("filter-lop-vq").innerHTML = `<option value="">Tất cả lớp</option>` + 
    dslop.map(l => `<option value="${l}">${l}</option>`).join("");
}

// === CHUYỂN TAB ===
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", function() {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    this.classList.add("active");
    document.getElementById(this.dataset.page).classList.add("active");

    // NHẤN TAB HV VỀ QUÊ → TỰ ĐỘNG TẢI DỮ LIỆU
    if (this.dataset.page === "hv-ve-que" && dsVeQue.length === 0) {
      setTimeout(taiDanhSachVeQue, 100);
    }
  });
});

// === GÁN SỰ KIỆN TÌM KIẾM ===
document.getElementById("search-hv").oninput = capNhatBangChinh;
document.getElementById("filter-lop-hv").onchange = capNhatBangChinh;
document.getElementById("filter-tt-hv").onchange = capNhatBangChinh;
document.getElementById("tai-lai-hv").onclick = taiDanhSachChinh;

document.getElementById("search-vq").oninput = hienThiBangVeQue;
document.getElementById("filter-lop-vq").onchange = hienThiBangVeQue;
document.getElementById("tai-lai-vq").onclick = taiDanhSachVeQue;

// === TỰ ĐỘNG TẢI DANH SÁCH CHÍNH KHI MỞ TRANG ===
window.onload = function() {
  taiDanhSachChinh();
};
</script>
</body>
</html>
