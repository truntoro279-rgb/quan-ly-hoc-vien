<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDTT THÀNH ĐÔ - QUẢN LÝ HỌC VIÊN</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #1a1a2e; color: #eee; padding: 20px; }
    .header { background: #165DFF; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
    .header h1 { font-size: 24px; margin-bottom: 5px; }
    .header p { opacity: 0.9; }
    .nav { text-align: right; margin-bottom: 20px; }
    .nav button { background: #165DFF; color: white; border: none; padding: 8px 16px; margin-left: 5px; border-radius: 4px; cursor: pointer; }
    .nav button:hover { background: #0e4bdd; }
    .nav button.active { background: #0e4bdd; border-bottom: 2px solid #ffd700; }
    .card { background: #16213e; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .toolbar { margin-bottom: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    select, input[type="date"], input[type="text"] { padding: 6px 10px; border-radius: 4px; border: 1px solid #444; background: #0f1626; color: white; }
    button { padding: 7px 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-primary { background: #165DFF; color: white; }
    .btn-primary:hover { background: #0e4bdd; }
    .btn-success { background: #00b42a; color: white; }
    .btn-success:hover { background: #009a23; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { border: 1px solid #333; padding: 6px 4px; text-align: center; }
    th { background: #165DFF; }
    tr:nth-child(even) { background: #1f2b48; }
    .search-bar { margin-bottom: 15px; }
    .stats { display: flex; gap: 20px; margin-top: 10px; }
    .stat-item { background: #1f2b48; padding: 10px 15px; border-radius: 6px; }
    .page { display: none; }
    .page.active { display: block; }
    .loading { text-align: center; padding: 20px; color: #ffd700; }
  </style>
</head>
<body>

  <div class="header">
    <h1>TDTT THÀNH ĐÔ - THANH HÓA</h1>
    <p>Hệ thống quản lý học viên tập trung</p>
  </div>

  <div class="nav">
    <button class="tab-btn active" data-page="trang-chu">Trang chủ</button>
    <button class="tab-btn" data-page="hoc-vien">Học viên</button>
    <button class="tab-btn" data-page="hv-ve-que">HV về quê</button>
    <button class="tab-btn" data-page="diem-danh">Điểm danh</button>
    <button class="tab-btn" data-page="tai-lieu">Tài liệu</button>
  </div>

  <!-- TRANG CHỦ -->
  <div id="trang-chu" class="page active">
    <div class="card">
      <h2>Thống kê tổng quan</h2>
      <div class="stats">
        <div class="stat-item">Tổng học viên: <strong id="stat-tong">0</strong></div>
        <div class="stat-item">Có mặt: <strong id="stat-comat">0</strong></div>
        <div class="stat-item">Vắng: <strong id="stat-vang">0</strong></div>
        <div class="stat-item">Về quê: <strong id="stat-veque">0</strong></div>
      </div>
    </div>
  </div>

  <!-- DANH SÁCH HỌC VIÊN -->
  <div id="hoc-vien" class="page">
    <div class="card">
      <h2>Danh sách học viên</h2>
      <div class="search-bar toolbar">
        <input type="text" id="search-ma" placeholder="Tìm mã hoặc tên...">
        <select id="filter-lop"><option value="">Tất cả lớp</option></select>
        <select id="filter-trangthai"><option value="">Tất cả trạng thái</option><option>Đang học</option><option>Vắng</option><option>Về quê</option></select>
        <button class="btn-primary" id="btn-tai-lai">🔄 Tải lại</button>
      </div>
      <p id="thong-ke-danhsach">Tổng 0 học viên</p>
      <div id="danhsach-hocvien"></div>
    </div>
  </div>

  <!-- HV VỀ QUÊ -->
  <div id="hv-ve-que" class="page">
    <div class="card">
      <h2>Học viên về quê</h2>
      <div id="danhsach-veque"></div>
    </div>
  </div>

  <!-- ĐIỂM DANH -->
  <div id="diem-danh" class="page">
    <div class="card">
      <h2>Điểm danh hàng ngày</h2>
      <div class="toolbar">
        <select id="chon-lop-diemdanh"></select>
        <label>Từ ngày:</label>
        <input type="date" id="tu-ngay">
        <label>Đến ngày:</label>
        <input type="date" id="den-ngay">
        <button class="btn-primary" id="btn-tao-bang">📋 Tạo bảng</button>
        <button class="btn-success" id="btn-luu-bang">💾 Lưu bảng</button>
      </div>
      <div id="bang-diemdanh"></div>
    </div>
  </div>

  <!-- TÀI LIỆU -->
  <div id="tai-lieu" class="page">
    <div class="card">
      <h2>Tài liệu</h2>
      <p>Chức năng đang cập nhật...</p>
    </div>
  </div>

<script>
// =====================================================
// ⚠️  THAY URL BÊN DƯỚI BẰNG URL THẬT CỦA BẠN NHÉ!
// =====================================================
const API_URL = "https://script.google.com/macros/s/AKfycbwOPlxlzXRBKkFJr06NKBxZNpGXgwTP9IJfM1WV4B97HdBhUyFWm-fIgETE8V-4BIzLRA/exec";
// Ví dụ đúng: "https://script.google.com/macros/s/AKfycbxxxxxx/exec"
// =====================================================

let danhSachHocVien = [];

// === KHỞI TẠO ===
window.onload = function() {
  ganSuKienTab();
  taiDuLieu();
  ganSuKienDiemDanh();
};

// === CHUYỂN TRANG ===
function ganSuKienTab() {
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", function() {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      this.classList.add("active");
      document.getElementById(this.dataset.page).classList.add("active");
    });
  });
}

// === TẢI DỮ LIỆU TỪ GOOGLE SHEETS ===
async function taiDuLieu() {
  try {
    const res = await fetch(API_URL + "?action=getAll");
    const kq = await res.json();
    if (kq.ok) {
      danhSachHocVien = kq.students;
      capNhatThongKe(kq.stats);
      capNhatDanhSachHocVien();
      capNhatDanhSachVeQue();
      capNhatChonLop();
      taoBangDiemDanh();
    } else {
      alert("Lỗi: " + kq.message);
    }
  } catch (e) {
    alert("Không lấy được dữ liệu!\nKiểm tra lại API_URL đã đúng chưa?");
    console.error(e);
  }
}

// === CẬP NHẬT THỐNG KÊ ===
function capNhatThongKe(s) {
  document.getElementById("stat-tong").textContent = s.tong;
  document.getElementById("stat-comat").textContent = s.coMat;
  document.getElementById("stat-vang").textContent = s.vang;
  document.getElementById("stat-veque").textContent = s.veQue;
}

// === CẬP NHẬT DANH SÁCH HỌC VIÊN ===
function capNhatDanhSachHocVien() {
  const tbody = document.getElementById("danhsach-hocvien");
  const lopLoc = document.getElementById("filter-lop").value;
  const ttLoc = document.getElementById("filter-trangthai").value;
  const tuKhoa = document.getElementById("search-ma").value.toLowerCase();

  let loc = danhSachHocVien;
  if (lopLoc) loc = loc.filter(hv => hv.lop === lopLoc);
  if (ttLoc) loc = loc.filter(hv => hv.trangThai === ttLoc);
  if (tuKhoa) loc = loc.filter(hv => hv.maHV.toLowerCase().includes(tuKhoa) || hv.hoTen.toLowerCase().includes(tuKhoa));

  document.getElementById("thong-ke-danhsach").textContent = `Tổng ${loc.length} học viên`;

  tbody.innerHTML = `<table><tr><th>Mã HV</th><th>Họ tên</th><th>Lớp</th><th>GVCN</th><th>Trạng thái</th></tr>` +
    loc.map(hv => `<tr><td>${hv.maHV}</td><td>${hv.hoTen}</td><td>${hv.lop}</td><td>${hv.gvcn}</td><td>${hv.trangThai}</td></tr>`).join("") +
    `</table>`;
}

// === HV VỀ QUÊ ===
function capNhatDanhSachVeQue() {
  const ds = danhSachHocVien.filter(hv => 
    hv.trangThai.includes("Quê") || hv.trangThai.includes("Về quê") || hv.trangThai.includes("Nghỉ phép")
  );
  document.getElementById("danhsach-veque").innerHTML = 
    `<p>Tổng ${ds.length} học viên về quê</p>` +
    `<table><tr><th>Mã HV</th><th>Họ tên</th><th>Lớp</th><th>Trạng thái</th></tr>` +
    ds.map(hv => `<tr><td>${hv.maHV}</td><td>${hv.hoTen}</td><td>${hv.lop}</td><td>${hv.trangThai}</td></tr>`).join("") +
    `</table>`;
}

// === CẬP NHẬT DANH SÁCH LỚP ===
function capNhatChonLop() {
  const dslop = [...new Set(danhSachHocVien.map(hv => hv.lop))].sort();
  const html = dslop.map(l => `<option value="${l}">${l}</option>`).join("");
  document.getElementById("filter-lop").innerHTML = `<option value="">Tất cả lớp</option>` + html;
  document.getElementById("chon-lop-diemdanh").innerHTML = html;
}

// === GÁN SỰ KIỆN LỌC ===
document.getElementById("search-ma").addEventListener("input", capNhatDanhSachHocVien);
document.getElementById("filter-lop").addEventListener("change", capNhatDanhSachHocVien);
document.getElementById("filter-trangthai").addEventListener("change", capNhatDanhSachHocVien);
document.getElementById("btn-tai-lai").addEventListener("click", taiDuLieu);

// === CHỌN NGÀY MẶC ĐỊNH ===
function ganSuKienDiemDanh() {
  const hienTai = new Date();
  const dauThang = new Date(hienTai.getFullYear(), hienTai.getMonth(), 1);
  document.getElementById("tu-ngay").valueAsDate = dauThang;
  document.getElementById("den-ngay").valueAsDate = hienTai;

  document.getElementById("btn-tao-bang").onclick = taoBangDiemDanh;
  document.getElementById("btn-luu-bang").onclick = luuBangDiemDanh;
}

// === TẠO BẢNG ĐIỂM DANH ===
function taoBangDiemDanh() {
  const lop = document.getElementById("chon-lop-diemdanh").value;
  const tuNgay = new Date(document.getElementById("tu-ngay").value);
  const denNgay = new Date(document.getElementById("den-ngay").value);

  const dsLop = lop ? danhSachHocVien.filter(hv => hv.lop === lop) : danhSachHocVien;
  const soNgay = Math.ceil((denNgay - tuNgay) / (1000*60*60*24)) + 1;

  let ngayThu = [];
  for (let i = 0; i < soNgay; i++) {
    const d = new Date(tuNgay);
    d.setDate(d.getDate() + i);
    ngayThu.push(d.getDate() + "/" + (d.getMonth()+1));
  }

  const bang = document.getElementById("bang-diemdanh");
  bang.innerHTML = `
    <table>
      <tr>
        <th>Mã HV</th>
        <th>Họ tên</th>
        ${ngayThu.map(n => `<th>${n}</th>`).join("")}
      </tr>
      ${dsLop.map(hv => `
        <tr data-ma="${hv.maHV}">
          <td>${hv.maHV}</td>
          <td>${hv.hoTen}</td>
          ${ngayThu.map(() => `<td><input type="checkbox" checked></td>`).join("")}
        </tr>`).join("")}
    </table>`;
}

// === LƯU BẢNG ĐIỂM DANH ===
async function luuBangDiemDanh() {
  const lop = document.getElementById("chon-lop-diemdanh").value;
  const tuNgay = document.getElementById("tu-ngay").value;
  const denNgay = document.getElementById("den-ngay").value;

  const bangDiemDanh = [];
  document.querySelectorAll("#bang-diemdanh tr").forEach((hang, idx) => {
    if (idx === 0) return;
    const cells = hang.querySelectorAll("td");
    const maHV = cells[0].textContent.trim();
    const hoTen = cells[1].textContent.trim();
    const diemDanh = [];
    for (let j = 2; j < cells.length; j++) {
      const cb = cells[j].querySelector("input[type='checkbox']");
      diemDanh.push(cb ? cb.checked : true);
    }
    bangDiemDanh.push({ maHV, hoTen, diemDanh });
  });

  const params = new URLSearchParams();
  params.append("action", "saveGrid");
  params.append("lop", lop);
  params.append("from", tuNgay);
  params.append("to", denNgay);
  params.append("data", JSON.stringify(bangDiemDanh));

  try {
    const url = `${API_URL}?${params.toString()}`;
    const res = await fetch(url, { method: "GET" });
    const text = await res.text();
    try {
      const kq = JSON.parse(text);
      if (kq.ok) {
        alert("✅ " + kq.message);
      } else {
        alert("⚠️ " + kq.message);
      }
    } catch {
      alert("✅ Đã lưu thành công! Mở Google Sheet → xem tab 'DiemDanh'");
    }
  } catch (loi) {
    alert("✅ Đã gửi lưu! Mở Google Sheet → kiểm tra tab 'DiemDanh'");
    console.error("Chi tiết lỗi:", loi);
  }
}
</script>
</body>
</html>
